<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Записано">
<meta name="theme-color" content="#f2f5f8">
<title>Записано — прототип для мастера</title>
<style>
  /* ============================================================
     Оформление. Спокойный светло-серый фон, белые карточки без рамок,
     мягкие тени, крупная типографика. Глубину даёт заливка и тень, а не линии.
     ============================================================ */
  :root{
    --bg:#eef1f6; --card:#ffffff; --card2:#e5eaf2; --line:rgba(16,24,40,.07);
    --text:#101724; --muted:#77839a;
    --accent:#0d7ab0; --accent-soft:rgba(13,122,176,.10); --tint:rgba(13,122,176,.13);
    --on-accent:#ffffff; --accent-glow:rgba(13,122,176,.35);
    --green:#1f9d55; --amber:#b07800; --red:#d1493c;
    --s1:0 1px 2px rgba(16,24,40,.06);
    --s2:0 8px 22px rgba(16,24,40,.07);
    --s3:0 14px 40px rgba(16,24,40,.14);
    --r:20px;
  }
  #phone.dark{
    --bg:#0e1116; --card:#181d25; --card2:#232a34; --line:rgba(255,255,255,.08);
    --text:#e9eef5; --muted:#8b96a8;
    --accent:#4db8e8; --accent-soft:rgba(77,184,232,.14); --tint:rgba(77,184,232,.16);
    --on-accent:#07202c; --accent-glow:rgba(77,184,232,.30);
    --green:#3fc27f; --amber:#e0a83a; --red:#ff7a6b;
    --s1:0 1px 2px rgba(0,0,0,.35); --s2:0 8px 22px rgba(0,0,0,.4); --s3:0 14px 40px rgba(0,0,0,.55);
  }
  #phone.dark nav{background:rgba(24,29,37,.94);}
  #phone.dark .wgt{background:linear-gradient(165deg,#222a35,#181d25);}
  #phone.dark .seg button.active{background:#333c49;}
  #phone.dark .tog i{background:#f2f5f9;}

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  #phone, #sheet, nav, #toast{
    -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  input, textarea, .in, .note-in, .search, .msg-prev, .np-b{
    -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
  }
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    background:#0b0e12; display:flex; justify-content:center; align-items:center;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  #phone{
    width:100%; max-width:420px; height:100vh; max-height:920px;
    background:var(--bg); color:var(--text); position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  @media(min-width:500px){ #phone{border-radius:42px; height:92vh; box-shadow:0 30px 80px rgba(0,0,0,.6);} }

  /* ---------- заголовок ---------- */
  header{
    padding:calc(18px + env(safe-area-inset-top, 0px)) 20px 6px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
  }
  header h1{font-size:31px; font-weight:700; letter-spacing:-.8px; line-height:1.1;}
  header .sub{color:var(--muted); font-size:13px; margin-top:5px; line-height:1.3;}
  .earned{text-align:right; line-height:1;}
  .earned b{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
  .earned span{display:block; font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-top:5px;}
  .badge{
    font-size:9.5px; color:var(--muted); background:var(--card2); border-radius:20px;
    padding:5px 9px; letter-spacing:.5px;
  }

  main{flex:1; overflow-y:auto; padding:6px 16px 150px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
  .screen{display:none;}
  .screen.active{display:block;}
  @keyframes slL{from{opacity:.35; transform:translateX(16px)} to{opacity:1; transform:none}}
  @keyframes slR{from{opacity:.35; transform:translateX(-16px)} to{opacity:1; transform:none}}
  .screen.sl{animation:slL .2s ease-out;}
  .screen.sr{animation:slR .2s ease-out;}

  h2.sect{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); font-weight:600;
    margin:24px 6px 10px; display:flex; justify-content:space-between; align-items:center;
  }
  h2.sect .act{color:var(--accent); text-transform:none; letter-spacing:0; font-size:13.5px; font-weight:600; cursor:pointer;}
  .empty{color:var(--muted); text-align:center; padding:44px 20px; font-size:14px; line-height:1.65;}

  /* ---------- нижняя панель ---------- */
  nav{
    position:absolute; bottom:calc(10px + env(safe-area-inset-bottom, 0px)); left:12px; right:12px;
    height:64px; background:rgba(255,255,255,.94); backdrop-filter:blur(20px) saturate(160%);
    border-radius:24px; box-shadow:var(--s2); display:flex; z-index:30; padding:5px;
  }
  nav button{
    flex:1; background:none; border:none; color:var(--muted); font-size:10.5px; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    cursor:pointer; position:relative; border-radius:19px; font-weight:500;
  }
  nav button::before{
    content:''; position:absolute; inset:0; border-radius:19px; background:transparent; transition:background .18s;
  }
  nav button.active{color:var(--accent); font-weight:600;}
  nav button.active::before{background:var(--accent-soft);}
  nav button .ico{display:flex; align-items:center; justify-content:center; height:24px; position:relative;}
  nav button .ico svg{width:23px; height:23px;}
  nav button span{position:relative;}

  #fab{
    position:absolute; right:20px; bottom:calc(90px + env(safe-area-inset-bottom, 0px));
    width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--on-accent);
    font-size:27px; font-family:inherit; font-weight:300; border:none; cursor:pointer; z-index:31;
    box-shadow:0 10px 26px var(--accent-glow); transition:transform .12s;
  }
  #fab:active{transform:scale(.93);}

  /* ---------- карточки и кнопки ---------- */
  .card{background:var(--card); border-radius:var(--r); padding:16px; margin-bottom:10px; box-shadow:var(--s1),var(--s2);}
  .card h3{font-size:15.5px; margin-bottom:9px;}
  .row2{display:flex; gap:8px;}
  .btn{
    flex:1; background:var(--accent); color:var(--on-accent); border:none; border-radius:16px;
    padding:15px; font-size:15.5px; font-family:inherit; cursor:pointer; font-weight:600;
    transition:transform .12s; box-shadow:0 6px 16px var(--accent-glow);
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:var(--card2); color:var(--text); font-weight:500; box-shadow:none;}
  .btn.wa{background:#1f9c50; color:#fff; box-shadow:0 6px 16px rgba(31,156,80,.28);}
  .btn.tg{background:#2e8fd0; color:#fff; box-shadow:0 6px 16px rgba(46,143,208,.28);}
  .btn.sm{padding:12px; font-size:14px; font-weight:600; border-radius:14px;}
  .back{
    width:38px; height:38px; border-radius:50%; background:var(--card); color:var(--text);
    border:none; font-size:20px; line-height:1; font-family:inherit; cursor:pointer;
    box-shadow:var(--s1),var(--s2); margin:2px 0 14px; padding-bottom:3px;
  }
  .kv{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:15px;}
  .kv:first-child{padding-top:2px;}
  .kv:last-child{border-bottom:none; padding-bottom:2px;}
  .kv span{color:var(--muted);}
  .kv b{font-variant-numeric:tabular-nums; font-weight:600;}

  /* ---------- напоминания ---------- */
  .remind-bar{
    background:var(--accent-soft); border-radius:var(--r); padding:14px 16px;
    display:flex; align-items:center; gap:13px; margin:12px 0 2px; cursor:pointer; transition:transform .12s;
  }
  .remind-bar:active{transform:scale(.99);}
  .remind-bar .rb-t{flex:1; font-size:14px; line-height:1.45;}
  .remind-bar b{color:var(--accent); font-weight:600;}
  .remind-bar .go{color:var(--accent); font-size:19px;}
  .remind-bar .rb-x{
    width:26px; height:26px; min-width:26px; border-radius:50%; background:var(--card);
    color:var(--muted); font-size:12px; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- полоса дней ---------- */
  .weekstrip{
    display:flex; gap:8px; margin:14px -16px 8px; padding:3px 16px 6px;
    overflow-x:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x;
    scrollbar-width:none; overscroll-behavior-x:contain;
  }
  .weekstrip::-webkit-scrollbar{display:none;}
  .wd{
    flex:0 0 72px; background:var(--card); border-radius:17px; padding:9px 2px 8px;
    text-align:center; cursor:pointer; box-shadow:var(--s1); transition:transform .12s;
  }
  .wd:active{transform:scale(.95);}
  .wd .dw{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.2px; white-space:nowrap; overflow:hidden;}
  .wd .dn{font-size:14.5px; font-weight:650; margin-top:2px; font-variant-numeric:tabular-nums; letter-spacing:-.3px;}
  .wd .load{height:3px; border-radius:2px; margin:5px 7px 0; background:var(--card2); overflow:hidden;}
  .wd .load i{display:block; height:100%; border-radius:2px; background:var(--accent);}
  .wd.sel{background:var(--accent); box-shadow:0 8px 20px var(--accent-glow);}
  .wd.sel .dw{color:rgba(255,255,255,.75);}
  .wd.sel .dn{color:#fff;}
  .wd.sel .load{background:rgba(255,255,255,.25);}
  .wd.sel .load i{background:#fff;}
  .wd.today:not(.sel) .dn{color:var(--accent);}
  .wd.offday{opacity:.45;}
  .wd.offday .dn{text-decoration:line-through;}
  .wnav{display:flex; justify-content:space-between; align-items:center; margin:2px 4px 0;}
  .wnav button{background:none; border:none; color:var(--accent); font-size:13px; font-weight:500; padding:6px 4px; cursor:pointer; font-family:inherit;}
  .wsum{font-size:12px; color:var(--muted);}
  .closebar{
    background:rgba(176,120,0,.13); border-radius:var(--r); padding:14px 16px;
    display:flex; align-items:center; gap:13px; margin:12px 0 2px; cursor:pointer;
  }
  .closebar .rb-t{flex:1; font-size:14px; line-height:1.45;}
  .closebar b{color:var(--amber); font-weight:600;}
  .offbar{
    display:flex; align-items:center; gap:12px; margin:12px 0 2px; padding:14px 16px;
    background:var(--card); border-radius:var(--r); font-size:14px; box-shadow:var(--s1);
  }
  .offbar span{flex:1; color:var(--muted); line-height:1.4;}
  .offbar button{
    border:none; background:var(--accent-soft); color:var(--accent); border-radius:12px;
    padding:9px 13px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap;
  }

  /* ---------- лента дня ---------- */
  .tl{position:relative; margin:18px 0 0; padding-left:48px;}
  .tl-hour{position:absolute; left:0; right:0; border-top:1px solid var(--line);}
  .tl-hour span{
    position:absolute; left:0; top:-8px; width:40px; text-align:right;
    font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .tl-now{position:absolute; left:42px; right:0; height:0; border-top:2px solid var(--accent); z-index:4; opacity:.9;}
  .tl-now::before{content:''; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--accent);}
  .bk{
    position:absolute; left:48px; right:0; background:var(--card); border-radius:16px;
    padding:9px 13px 9px 16px; overflow:hidden; cursor:pointer; z-index:2; box-shadow:var(--s1),var(--s2);
    transition:transform .12s;
  }
  .bk:active{transform:scale(.985);}
  .bk::before{
    content:''; position:absolute; left:6px; top:9px; bottom:9px; width:3.5px;
    border-radius:3px; background:var(--accent);
  }
  .bk .bk-top{display:flex; align-items:baseline; gap:8px;}
  .bk .bk-nm{font-size:15px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.2px;}
  .bk .bk-pr{font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .bk .bk-sv{font-size:12.5px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bk .bk-tm{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .bk.came::before{background:var(--green);}
  .bk.came .bk-nm::after{content:' ✓'; color:var(--green); font-size:12.5px;}
  .bk.noshow::before{background:var(--amber);}
  .bk.noshow .bk-nm{color:var(--muted);}
  .bk.cancel{opacity:.45; box-shadow:var(--s1);}
  .bk.cancel .bk-nm{text-decoration:line-through;}
  .bk.blocked{background:var(--card2); box-shadow:none;}
  .bk.blocked::before{background:var(--muted); opacity:.5;}
  .bk .rem-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--amber); margin-left:6px; vertical-align:middle;}
  .gap{
    position:absolute; left:48px; right:0; border:1.5px dashed var(--line); border-radius:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:12px; color:var(--muted); z-index:1; transition:background .15s;
  }
  .gap:active{background:var(--accent-soft);}
  .gap-w{
    margin-left:8px; background:var(--accent-soft); color:var(--accent); border-radius:12px;
    padding:4px 8px; font-size:11.5px; font-weight:600;
  }

  /* ---------- клиенты ---------- */
  .search{
    width:100%; background:var(--card2); border:none; border-radius:16px;
    padding:14px 16px; font-size:15px; color:var(--text); font-family:inherit; outline:none; margin-top:12px;
  }
  .search::placeholder{color:var(--muted);}
  .cl{
    background:var(--card); border-radius:18px; padding:13px 15px; margin-bottom:8px;
    display:flex; align-items:center; gap:13px; cursor:pointer; box-shadow:var(--s1); transition:transform .12s;
  }
  .cl:active{transform:scale(.985);}
  .av{
    width:42px; height:42px; min-width:42px; border-radius:50%; background:var(--tint);
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--accent);
  }
  .cl-b{flex:1; min-width:0;}
  .cl-nm{font-size:15.5px; font-weight:600; display:flex; align-items:center; gap:6px; letter-spacing:-.2px;}
  .cl-nm .star{color:var(--amber); font-size:12px;}
  .cl-mt{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .cl-r{text-align:right; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .row3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 4px;}
  .b3{
    background:var(--card); border:none; border-radius:16px; padding:13px 4px 11px; cursor:pointer;
    font-family:inherit; color:var(--text); box-shadow:var(--s1); transition:transform .12s;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .b3:active{transform:scale(.96);}
  .b3 svg{width:21px; height:21px;}
  .b3 span{font-size:12.5px;}
  .b3-ok{background:var(--accent); color:var(--on-accent); box-shadow:0 6px 16px var(--accent-glow);}
  .b3-ok.done{background:var(--green); box-shadow:none; color:#fff;}
  .bk-st{
    display:inline-block; margin-top:10px; padding:6px 12px; border-radius:20px;
    font-size:12.5px; font-weight:600; background:var(--card2); color:var(--muted);
  }
  .bk-st-came{background:rgba(31,157,85,.14); color:var(--green);}
  .bk-st-noshow{background:rgba(176,120,0,.15); color:var(--amber);}
  .bk-st-plan{background:var(--accent-soft); color:var(--accent);}
  .cl-msg{
    width:36px; height:36px; border-radius:12px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .cl-msg svg{width:18px; height:18px;}
  .cl-nm .star svg{width:12.5px; height:12.5px;}
  .cl-nm .wait-b{color:var(--muted); line-height:0;}
  .cl-nm .wait-b svg{width:13px; height:13px;}
  .btn.ic{display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn.ic svg{width:17px; height:17px;}
  .cl.lost{background:linear-gradient(180deg,rgba(176,120,0,.09),rgba(176,120,0,.05));}
  .cl.lost .cl-mt{color:var(--amber);}
  .note-in{
    width:100%; background:var(--card2); border:none; border-radius:16px; padding:14px;
    font-size:14.5px; color:var(--text); font-family:inherit; outline:none; resize:vertical; min-height:76px; line-height:1.5;
  }
  .hist{display:flex; align-items:center; font-size:14.5px; padding:11px 0; border-bottom:1px solid var(--line);}
  .hist:last-child{border-bottom:none;}
  .hist .h-d{color:var(--muted); font-variant-numeric:tabular-nums; min-width:76px; font-size:13px;}
  .hist .h-s{flex:1; padding:0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hist .h-p{font-variant-numeric:tabular-nums; font-weight:600;}
  .hist.hs-noshow .h-s{color:var(--amber);}

  /* ---------- деньги ---------- */
  .big{background:var(--card); border-radius:24px; padding:22px 20px; margin-top:12px; box-shadow:var(--s1),var(--s2);}
  .big .bn{font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-1.6px; line-height:1;}
  .big .bl{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.9px; margin-top:8px; font-weight:600;}
  .big .cmp{font-size:13px; color:var(--muted); margin-top:14px; padding-top:14px; border-top:1px solid var(--line); line-height:1.5;}
  .big .cmp b.up{color:var(--green);} .big .cmp b.down{color:var(--red);}
  .mnav{
    display:flex; align-items:center; gap:4px; margin:14px 0 2px;
    background:var(--card); border-radius:16px; padding:4px; box-shadow:var(--s1);
  }
  .mnav button{
    background:none; border:none; color:var(--accent); border-radius:12px;
    padding:10px 12px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:500; white-space:nowrap;
  }
  .mnav button:active{background:var(--accent-soft);}
  .mtrack{
    flex:1; min-width:0; overflow:hidden; touch-action:pan-y; cursor:grab;
  }
  .mslide{
    display:flex; width:300%; transform:translateX(-33.3333%);
    will-change:transform;
  }
  .mlab{
    width:33.3333%; text-align:center; font-size:15px; font-weight:650; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:2px 4px;
  }
  .mlab.side{color:var(--muted); font-weight:500;}
  .mnav button{
    background:var(--card); border:none; color:var(--text); border-radius:13px;
    width:36px; height:34px; cursor:pointer; font-family:inherit; font-size:15px; box-shadow:var(--s1);
  }
  .mnav .mn{font-size:14.5px; font-weight:600;}
  .dash{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:9px;}
  .dc{background:var(--card); border-radius:18px; padding:14px 15px; box-shadow:var(--s1);}
  .dc .dv{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.6px;}
  .dc .dl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-top:5px; font-weight:600;}
  .dc .ds{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4;}
  .dc.wide{grid-column:1 / -1;}
  .dc.accent{background:var(--accent-soft); box-shadow:none;}
  .dc.accent .dv{color:var(--accent);}
  .ds-link{color:var(--amber); font-weight:600;}
  .bar{margin-bottom:12px;}
  .bar .bt{display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px;}
  .bar .bt b{font-variant-numeric:tabular-nums; font-weight:600;}
  .bar .bw{height:8px; background:var(--card2); border-radius:5px; overflow:hidden;}
  .bar .bw i{display:block; height:100%; background:var(--accent); border-radius:5px;}
  .ex{display:flex; justify-content:space-between; align-items:center; font-size:14.5px; padding:11px 0; border-bottom:1px solid var(--line);}
  .ex:last-child{border-bottom:none;}
  .ex .x{color:var(--muted); padding-left:12px; cursor:pointer; font-size:15px;}
  .ex-x{color:var(--muted); padding-left:10px; cursor:pointer;}

  /* ---------- настройки ---------- */
  .sw{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);}
  .sw:first-child{padding-top:2px;}
  .sw:last-child{border-bottom:none; padding-bottom:2px;}
  .sw .sw-b{flex:1;}

const today = new Date(); today.setHours(0,0,0,0);
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shift(n){ const d=new Date(today); d.setDate(d.getDate()+n); return d; }
function fromISO(s){ const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtD(s){ const d=fromISO(s); return d.getDate()+' '+MON[d.getMonth()]; }
function dayDiff(a,b){ return Math.round((fromISO(a)-fromISO(b))/86400000); }
function relDay(s){
  const n = dayDiff(s, iso(today));
  if(n===0) return L('today');
  if(n===1) return L('tomorrow');
  if(n===-1) return L('yesterday');
  return fmtD(s);
}
function toMin(t){ const p=t.split(':'); return +p[0]*60 + +p[1]; }
function fromMin(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
const SHORT_EN = {RUB:'ruble', UAH:'hryvnia', KZT:'tenge', BYN:'ruble', KGS:'som', UZS:'sum',
  AMD:'dram', BGN:'lev', RSD:'dinar', GEL:'lari', TJS:'somoni', TMT:'manat', AZN:'manat',

function curShort(c){ return loc()==='en'? (SHORT_EN[c.code] || c.short) : c.short; }
function curDef(){ return CUR.find(c=>c.code===((S&&S.set&&S.set.cur)||'RUB')) || CUR[0]; }
function money(v){
  const c = curDef(), lc = loc()==='en'? 'en-US' : 'ru-RU';
  const n = c.dec
    ? (Math.round(v*100)/100).toLocaleString(lc, {minimumFractionDigits:c.dec, maximumFractionDigits:c.dec})
    : Math.round(v).toLocaleString(lc);
  return c.pos==='before'? c.symbol + n : n + ' ' + c.symbol;
}
function plural(n,a,b,c){
  if(loc()==='en'){
    const f = PLURAL_EN[a];
    if(f) return n===1? f[0] : f[1];
  }
  const m=n%100, k=n%10;
  if(m>10&&m<20) return c;
  if(k===1) return a;
  if(k>1&&k<5) return b;
  return c;
}

    const [interval, lastAgo] = meta[i];
    const s0 = sv[i % sv.length];
    const c = { id:i+1, name, phone:'+79'+String(161112233 + i*1010101),
      note:'', f1:notes[i], f2:'', regular: interval<=21, created:iso(shift(-320)) };
    clients.push(c);
    // история визитов: назад от последнего, с шагом в свой интервал
    for(let k=0;k<7;k++){
      const ago = lastAgo + interval*k;
      if(ago > 200) break;
      const s = (k%3===2)? sv[(i+1) % sv.length] : s0;

  // что уже прошло сегодня — считаем состоявшимся
  const nowM = new Date().getHours()*60 + new Date().getMinutes();
  bookings.filter(b=>b.date===iso(today) && b.cid && toMin(b.time)+b.min < nowM)

  const td = bookings.filter(b=>b.date===iso(today)).sort((a,b)=>a.time.localeCompare(b.time));
  for(let i=0;i<td.length-1;i++){

function P(){ return VOC; }
function esc(t){ return String(t).replace(/'/g, "\\'").replace(/"/g,'&quot;'); }
function dayBookings(d){ return S.bookings.filter(b=>b.date===d).sort((a,b)=>a.time.localeCompare(b.time)); }
function client(id){ return S.clients.find(c=>c.id===id); }
function clientVisits(id){
  return S.bookings.filter(b=>b.cid===id && (b.status==='came'||b.status==='noshow') && b.date<=iso(today))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function clientNext(id){
  return S.bookings.filter(b=>b.cid===id && b.status==='plan' && b.date>=iso(today))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];
}
function avgInterval(id){
  const v = clientVisits(id).filter(b=>b.status==='came').map(b=>b.date);
  if(v.length<2) return null;
  let sum=0;
  for(let i=0;i<v.length-1;i++) sum += dayDiff(v[i], v[i+1]);
  return Math.round(sum/(v.length-1));
}
function lostList(){
  return S.clients.map(c=>{
    const v = clientVisits(c.id).filter(b=>b.status==='came');
    if(!v.length) return null;
    const since = dayDiff(iso(today), v[0].date);
    const avg = avgInterval(c.id) || 30;
    if(clientNext(c.id)) return null;
    if(since >= 21 && since > avg*1.4) return {c, since, avg};
    return null;
  }).filter(Boolean).sort((a,b)=>b.since-a.since);
}
function toRemind(){
  const t = iso(shift(1));
  return S.bookings.filter(b=>b.date===t && b.status==='plan' && !b.reminded && b.cid)
    .sort((a,b)=>a.time.localeCompare(b.time));
}
function monthKey(off){ const d=new Date(today.getFullYear(), today.getMonth()+off, 1); return d; }
function inMonth(dateStr, off){
  const d = monthKey(off);
  return dateStr.startsWith(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
}
function monthStats(off){
  const came = S.bookings.filter(b=>b.status==='came' && inMonth(b.date,off));
  const inc = came.reduce((s,b)=>s+b.price,0);
  const exp = S.expenses.filter(e=>inMonth(e.date,off)).reduce((s,e)=>s+e.s,0);
  const noshow = S.bookings.filter(b=>b.status==='noshow' && inMonth(b.date,off)).length;
  const uniq = new Set(came.map(b=>b.cid)).size;
  const bySv = {};
  came.forEach(b=>{ bySv[b.sv] = (bySv[b.sv]||0) + b.price; });
  const top = Object.entries(bySv).sort((a,b)=>b[1]-a[1]);
  return { inc, exp, noshow, uniq, cnt:came.length, avg: came.length? inc/came.length : 0, top };
}
function SM(k){ return !S.set.sum || S.set.sum[k] !== false; }
function taxBaseShort(){ return S.set.taxBase==='profit'? 'с прибыли' : 'с оборота'; }
function taxSum(st){
  const pct = (+S.set.taxPct || 0) / 100;
  const base = S.set.taxBase==='profit'? Math.max(0, st.inc - st.exp) : st.inc;
  return base * pct;
}
function upcoming(off){
  const list = S.bookings.filter(b=>b.status==='plan' && b.date>=iso(today) && inMonth(b.date,off));
  return { cnt:list.length, sum:list.reduce((s,b)=>s+b.price,0), pre:list.reduce((s,b)=>s+(b.pre||0),0) };
}
function upcomingAll(){
  const list = S.bookings.filter(b=>b.status==='plan' && b.date>=iso(today));
  return { cnt:list.length, sum:list.reduce((s,b)=>s+b.price,0) };
}

function renderDay(){
  const list = dayBookings(selDay);
  let h = '';

  // полоса дней: длинная лента, прокручивается пальцем, выбор не съезжает
  const diff = dayDiff(selDay, iso(today));
  const from = Math.min(-30, diff-30), to = Math.max(180, diff+60);
  h += `<div class="weekstrip">`;
  for(let i=from;i<=to;i++){
    const d = shift(i);
    const k = iso(d);
    const bs = dayBookings(k).filter(b=>b.status!=='cancel' && b.status!=='blocked');
    const busy = Math.min(100, bs.reduce((s,b)=>s+b.min,0)/480*100);
    h += `<div class="wd ${k===selDay?'sel':''} ${k===iso(today)?'today':''} ${isOff(k)?'offday':''}" data-k="${k}" onclick="pickDay('${k}')">
      <div class="dw">${k===iso(today)?L('todayCap'):DW[d.getDay()]}</div>
      <div class="dn">${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}</div>
      <div class="load"><i style="width:${busy}%"></i></div></div>`;
  }
  h += `</div>
  <div class="wnav">
    <button onclick="stepDay(-1)">‹ день</button>
    <span class="wsum">${stripSum()}</span>
    <button onclick="stepDay(1)">день ›</button>
  </div>`;

  // плашки дня — под полосой дней
  const un = unmarkedFor(selDay);
  if(un.length){
    h += `<div class="closebar" onclick="openCloseDay()">
      <div style="font-size:19px">🌙</div>
      <div class="rb-t">${un.length} ${plural(un.length,'визит','визита','визитов')} не отмечены — деньги не посчитаны.
        <b>Закрыть день →</b></div></div>`;
  }

  const rem = toRemind();
  if(rem.length && selDay===iso(today) && S.set.remHide !== iso(today)){
    h += `<div class="remind-bar">
      <div style="font-size:19px" onclick="openRemindAll()">💬</div>
      <div class="rb-t" onclick="openRemindAll()">${L('tomorrowCap')} ${rem.length} ${plural(rem.length,'запись','записи','записей')} без напоминания.
        <b>Напомнить →</b></div>
      <div class="rb-x" onclick="hideRemind()">${ICS.cross}</div></div>`;
  }

  if(isOff(selDay)){
    h += `<div class="offbar">🌿<span>Выходной. Клиентам это время не предлагается.</span>
      <button onclick="toggleOff('${selDay}')">Сделать рабочим</button></div>`;
  }

  // лента дня
  if(!list.length){
    h += `<div class="empty">На ${relDay(selDay)} записей нет.<br>Нажмите «+», чтобы записать клиента.</div>`;
  } else {
    let startH = +S.set.dayFrom || 8, endH = +S.set.dayTo || 21;
    list.forEach(b=>{
      startH = Math.min(startH, Math.floor(toMin(b.time)/60));
      endH   = Math.max(endH, Math.ceil((toMin(b.time)+b.min)/60));
    });
    const PPM = 1.5, top0 = startH*60;
    h += `<div class="tl" style="height:${(endH-startH)*60*PPM}px">`;
    for(let hh=startH; hh<=endH; hh++){
      h += `<div class="tl-hour" style="top:${(hh*60-top0)*PPM}px"><span>${hh}:00</span></div>`;
    }
    if(selDay===iso(today)){
      const now = new Date().getHours()*60 + new Date().getMinutes();
      if(now>top0 && now<endH*60) h += `<div class="tl-now" style="top:${(now-top0)*PPM}px"></div>`;
    }
    // окна между записями
    const act = list.filter(b=>b.status!=='cancel');
    for(let i=0;i<act.length-1;i++){
      const e = toMin(act[i].time)+act[i].min, s = toMin(act[i+1].time);
      if(s-e >= 25){
        const wl = S.set.gapWait===false? 0 : waitList().length;

      lay.push({s:t, e:tEnd, col});

        </div>

      </div>`;
    });
    h += `</div>`;
  }
  document.getElementById('scr-day').innerHTML = h;
  syncStrip();
}
let stripScroll = null, lastSel = null;
function syncStrip(){
  const rail = document.querySelector('#scr-day .weekstrip');
  if(!rail || !rail.addEventListener) return;
  rail.addEventListener('scroll', ()=>{ stripScroll = rail.scrollLeft; }, {passive:true});
  if(stripScroll !== null) rail.scrollLeft = stripScroll;
  const changed = lastSel !== selDay;
  lastSel = selDay;
  const sel = rail.querySelector('.wd.sel');
  if(!sel) return;
  const first = stripScroll === null;
  // первый раз — выбранный день слева, как в системном календаре
  if(first){
    rail.scrollLeft = Math.max(0, sel.offsetLeft - 16);
    stripScroll = rail.scrollLeft;
    return;
  }
  // если выбранный день ушёл за край — подтянуть его, но только когда день сменился
  if(!changed) return;
  const l = sel.offsetLeft - 16, r = l + sel.offsetWidth + 16;
  if(l < rail.scrollLeft || r > rail.scrollLeft + rail.clientWidth){
    const target = Math.max(0, l - (r > rail.scrollLeft + rail.clientWidth ? rail.clientWidth - sel.offsetWidth - 48 : 0));
    if(rail.scrollTo) rail.scrollTo({left:target, behavior:'smooth'}); else rail.scrollLeft = target;
    stripScroll = target;
  }
}

function stepMonth(n){ slideMonth(n>0? 1 : -1); }

const M_DUR = 240;
let mBusy = false;
// доводим название до соседнего месяца и только потом пересчитываем экран
function slideMonth(dir){
  const sl = document.getElementById('mslide');
  if(mBusy) return;
  if(!sl || !sl.style){ monthOff += dir; renderMoney(); return; }
  mBusy = true;
  sl.style.transition = 'transform '+M_DUR+'ms cubic-bezier(.32,.72,0,1)';
  sl.style.transform = 'translateX('+(dir>0? -66.6667 : 0)+'%)';
  setTimeout(()=>{ mBusy = false; monthOff += dir; renderMoney(); anim('scr-money', dir); }, M_DUR);
}
// перетаскивание названия месяца: содержимое едет за пальцем
function syncMonths(){
  const tr = document.getElementById('mtrack'), sl = document.getElementById('mslide');
  if(!tr || !sl || !tr.addEventListener) return;
  let x0 = null, y0 = null, lock = null, w = 1;
  const base = -33.3333;
  const set = px => { sl.style.transition = 'none'; sl.style.transform = 'translateX(calc('+base+'% + '+px+'px))'; };
  const home = () => { sl.style.transition = 'transform 180ms ease-out'; sl.style.transform = 'translateX('+base+'%)'; };
  const begin = (x,y) => { if(mBusy) return; x0=x; y0=y; lock=null; w = tr.clientWidth || 200; };
  const move = (x,y) => {
    if(x0===null) return;
    const dx = x-x0, dy = y-y0;
    if(lock===null && (Math.abs(dx)>6 || Math.abs(dy)>6)) lock = Math.abs(dx) > Math.abs(dy)? 'x':'y';
    if(lock==='x') set(Math.max(-w, Math.min(w, dx)) * 0.9);
  };
  const end = x => {
    if(x0===null) return;
    const dx = x-x0; x0=null;
    if(lock!=='x'){ return; }
    lock=null;
    if(Math.abs(dx) > Math.min(60, w*0.22)) slideMonth(dx<0? 1 : -1);
    else home();
  };
  tr.addEventListener('touchstart', e=>{ if(e.touches.length===1) begin(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  tr.addEventListener('touchmove',  e=>{ if(e.touches.length===1) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  tr.addEventListener('touchend',   e=>{ end(e.changedTouches[0].clientX); }, {passive:true});
  tr.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse') begin(e.clientX, e.clientY); });
  tr.addEventListener('pointermove', e=>{ if(e.pointerType==='mouse' && x0!==null) move(e.clientX, e.clientY); });
  tr.addEventListener('pointerup',   e=>{ if(e.pointerType==='mouse') end(e.clientX); });
  tr.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse' && x0!==null){ x0=null; lock=null; home(); } });
}
function anim(id, n){
  const el = document.getElementById(id);
  if(!el || !el.classList) return;
  el.classList.remove('sl','sr'); void el.offsetWidth; el.classList.add(n>0?'sl':'sr');
}
// листание влево-вправо: палец на телефоне, мышь на компьютере
function swipe(el, onLeft, onRight){
  if(!el || !el.addEventListener) return;
  let x0=null, y0=null, lock=null;
  const begin=(x,y)=>{ x0=x; y0=y; lock=null; };
  const move=(x,y)=>{
    if(x0===null || lock) return;
    const dx=x-x0, dy=y-y0;
    if(Math.abs(dx)>9 || Math.abs(dy)>9) lock = Math.abs(dx) > Math.abs(dy)*1.3 ? 'x' : 'y';
  };
  const end=x=>{
    if(x0===null) return;
    const dx = x-x0;
    if(lock==='x' && Math.abs(dx)>42){ dx<0? onLeft() : onRight(); }
    x0=null; lock=null;
  };
  const inStrip = e => !!(e.target && e.target.closest && (e.target.closest('.weekstrip') || e.target.closest('.mtrack')));
  el.addEventListener('touchstart', e=>{ if(e.touches.length===1 && !inStrip(e)) begin(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  el.addEventListener('touchmove',  e=>{ if(e.touches.length===1) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  el.addEventListener('touchend',   e=>{ end(e.changedTouches[0].clientX); }, {passive:true});
  el.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse' && !inStrip(e)) begin(e.clientX, e.clientY); });
  el.addEventListener('pointermove', e=>{ if(e.pointerType==='mouse') move(e.clientX, e.clientY); });
  el.addEventListener('pointerup',   e=>{ if(e.pointerType==='mouse') end(e.clientX); });
}

      ? 'MAX пока не даёт ссылку с готовым текстом: приложение откроется, текст уже в буфере. В настоящем приложении подставим напрямую.'

function renderMoney(){
  const st = monthStats(monthOff), prev = monthStats(monthOff-1);
  const d = monthKey(monthOff);
  const diff = prev.inc? Math.round((st.inc-prev.inc)/prev.inc*100) : null;

  const up = upcoming(monthOff);
  const future = monthOff===0? upcomingAll() : null;

  // лента месяцев: перетаскивается пальцем прямо по названию
  const mLab = o => { const m = monthKey(o); return MONN[m.getMonth()] + ' ' + m.getFullYear(); };
  let h = `<div class="mnav">
    <button onclick="stepMonth(-1)">‹</button>
    <div class="mtrack" id="mtrack">
      <div class="mslide" id="mslide">
        <div class="mlab side">${mLab(monthOff-1)}</div>
        <div class="mlab">${mLab(monthOff)}</div>
        <div class="mlab side">${mLab(monthOff+1)}</div>
      </div>
    </div>
    <button onclick="stepMonth(1)">›</button>
  </div>`;
  const later = future? {cnt: future.cnt - up.cnt, sum: future.sum - up.sum} : null;
  const en = loc()==='en';
  const mi = d.getMonth(), pi = monthKey(monthOff-1).getMonth();
  const mName = MONN[mi];
  const T_earned = en? (monthOff===0? 'Earned so far this month' : 'Earned in '+MONN[mi])
    : (monthOff===0? 'Заработано с 1 '+MON[mi] : 'Заработано в '+MONP[mi]);
  const T_vs = en? ' vs '+MONN[pi] : ' к '+MOND[pi];
  const T_planned = en? 'Booked for '+MONN[mi] : 'Записано на '+MONN[mi].toLowerCase();
  const T_exp = en? 'Expenses in '+MONN[mi] : 'Расходы за '+MONN[mi].toLowerCase();

  // месяц ещё не наступил — показываем только план
  if(monthOff>0){
    h += `<div class="big" onclick="openMD('booked')">
      <div class="bn">${money(up.sum)}</div>
      <div class="bl">${T_planned}</div>
      <div class="cmp">${up.cnt? up.cnt+' '+plural(up.cnt,'визит','визита','визитов')
        + (up.pre? ' · предоплатой получено '+money(up.pre) : '') : 'пока никто не записан'}</div>
    </div>`;
    document.getElementById('scr-money').innerHTML = h;
    syncMonths();
    return;
  }

  h += `<div class="big" onclick="openMD('visits')">
    <div class="bn">${money(st.inc)}</div>
    <div class="bl">${T_earned}</div>
    <div class="cmp">${SM('avg')? 'средний чек '+money(st.avg) : st.cnt+' '+plural(st.cnt,'визит','визита','визитов')}
      ${(diff!==null && SM('cmp'))? ` · <b class="${diff>=0?'up':'down'}">${diff>=0?'+':''}${diff}%</b>${T_vs}`:''}</div>
  </div>`;

  // слева — что уже прошло, справа — что впереди; не пришедшие подписью
  const nsSum = S.bookings.filter(b=>b.status==='noshow' && inMonth(b.date,monthOff)).reduce((a,b)=>a+b.price,0);
  const nsLine = st.noshow
    ? `<span class="ds-link" onclick="event.stopPropagation();openMD('noshow')">не пришли: ${st.noshow} · ${money(nsSum)}</span>`
    : 'все пришли';
  const isNow = monthOff===0;
  h += `<div class="dash">
    ${(()=>{ const solo = (SM('clients')?1:0) + (SM('noshow')?1:0) === 1? ' wide':'';
      const left = `<div class="dc${solo}" onclick="openMD('visits')">
          <div class="dv">${st.cnt}</div><div class="dl">Визитов прошло</div>
          <div class="ds">${st.uniq} ${plural(st.uniq,'клиент','клиента','клиентов')}</div></div>`;
      // текущий месяц: справа сколько ещё придёт; прошлый: сколько сорвалось
      const right = isNow
        ? `<div class="dc${solo} ${up.cnt?'accent':''}" onclick="openMD('booked')">
            <div class="dv">${up.cnt}</div><div class="dl">Ещё придут</div>
            <div class="ds">${(SM('noshow') && st.noshow)? nsLine
              : (up.cnt? 'до конца месяца' : 'записей больше нет')}</div></div>`
        : `<div class="dc${solo}" onclick="openMD('noshow')">
            <div class="dv">${st.noshow}</div><div class="dl">Не пришли</div>
            <div class="ds">${st.noshow? 'упущено '+money(nsSum) : 'все пришли'}</div></div>`;
      return (SM('clients')? left:'') + (SM('noshow')||isNow? right:'');
    })()}
    ${SM('booked')? `<div class="dc ${up.cnt?'accent':''} wide" onclick="openMD('booked')">
      <div class="dv">${money(up.sum)}</div>
      <div class="dl">Ждём до конца месяца</div>
      <div class="ds">${up.cnt? (up.pre? 'из них '+money(up.pre)+' предоплатой' : 'по ценам из записей')
        : 'вперёд пока никто не записан'}</div>
      ${(later && later.cnt>0)? `<div class="ds">дальше: ещё ${later.cnt} ${plural(later.cnt,'визит','визита','визитов')} на ${money(later.sum)}</div>`:''}
    </div>`:''}
  </div>`;

  h += `${SM('exp')? `<div class="card" style="margin-top:10px">
    <div class="kv" onclick="openMD('expenses')"><span>${T_exp}</span><b>−${money(st.exp)} ›</b></div>
    <div class="kv" onclick="openMD('summary')"><span>Осталось на руках</span><b>${money(st.inc-st.exp)} ›</b></div>
    ${S.set.taxOn!==false? `<div class="kv"><span>Отложить на налог (${S.set.taxPct}% ${taxBaseShort()})</span><b>${money(taxSum(st))}</b></div>`:''}
  </div>
  ${S.set.taxOn!==false? `<div class="w-note" style="margin:6px 6px 0">Счётчик налога — простая арифметика для самоконтроля, не отчётность.</div>`:''}`:''}`;

  if(st.top.length && SM('top')){
    h += `<h2 class="sect">Что приносит деньги</h2>`;
    const max = st.top[0][1];
    st.top.slice(0,6).forEach(t=>{
      h += `<div class="bar"><div class="bt"><span>${t[0]}</span><b>${money(t[1])}</b></div>
        <div class="bw"><i style="width:${t[1]/max*100}%"></i></div></div>`;
    });
  }

  h += `<h2 class="sect">Расходы <span class="act" onclick="openExpense()">Добавить</span></h2><div class="card">`;
  const ex = S.expenses.filter(e=>inMonth(e.date,monthOff)).sort((a,b)=>b.date.localeCompare(a.date));
  if(!ex.length) h += `<div style="color:var(--muted);font-size:13.5px">В этом месяце расходов не записано.</div>`;
  ex.forEach(e=>{
    h += `<div class="ex"><span style="color:var(--muted);min-width:66px">${fmtD(e.date)}</span>
      <span style="flex:1;padding:0 8px">${e.t}</span>
      <b style="font-variant-numeric:tabular-nums">${money(e.s)}</b>
      <span class="x" onclick="delExpense(${e.id})">✕</span></div>`;
  });
  h += `</div>`;
  document.getElementById('scr-money').innerHTML = h;
  syncMonths();
}

}

        ${S.set.taxOn!==false? `<div class="kv"><span>Налог ${S.set.taxPct}% ${taxBaseShort()}</span><b>−${money(taxSum(st))}</b></div>

function notifLabel(m){
  if(loc()==='en'){
    if(m===0) return 'at the start';
    if(m===1440) return 'a day before';
    if(m===60) return 'an hour before';
    if(m>=60) return (m/60)+' hours before';
    return m+' min before';
  }
  if(m===0) return 'в момент начала';
  if(m===1440) return 'за сутки';
  if(m===60) return 'за час';
  if(m>=60) return 'за '+(m/60)+' '+plural(m/60,'час','часа','часов');
  return 'за '+m+' мин';
}
// «за сутки, за час и за 15 мин»
function joinRu(arr){
  if(arr.length<2) return arr.join('');
  return arr.slice(0,-1).join(', ') + ' и ' + arr[arr.length-1];
}
// что будет написано в уведомлении: «завтра в 15:00», «через час» и так далее
function notifBody(b, m){

  const when = en
    ? (m===1440? 'Tomorrow at '+b.time : m===0? 'Now: '+b.time

    : (m===1440? 'Завтра в '+b.time : m===0? 'Сейчас: '+b.time
      : m>=60? 'Через '+(m===60? 'час' : (m/60)+' '+plural(m/60,'час','часа','часов'))+': '+b.time
      : 'Через '+m+' мин: '+b.time);

const PALETTE = ['#0d7ab0','#2b62c4','#6b3fb5','#8d3468','#b02a4a','#c0562a',
                 '#b0782a','#6a8f1f','#1f8f62','#0f8a86','#3c4a5e','#5a6472'];
const OLD_ACC = {blue:'#0d7ab0', teal:'#0f8a86', green:'#1f8f62', plum:'#8d3468', ink:'#3c4a5e', sand:'#a8722a'};
function accentHex(){ return S.set.accentHex || OLD_ACC[S.set.accent] || PALETTE[0]; }

function rgbaOf(hex, a){
  const n = parseInt(String(hex).slice(1), 16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function lumOf(hex){
  const n = parseInt(String(hex).slice(1), 16);
  return (0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255)) / 255;
}
// на тёмной теме тёмные цвета осветляем, иначе их не видно
function forDark(hex){
  if(lumOf(hex) > .45) return hex;
  const n = parseInt(String(hex).slice(1), 16), k = .5;
  const mix = v => Math.round(v + (255-v)*k);
  return '#' + [mix((n>>16)&255), mix((n>>8)&255), mix(n&255)]
    .map(v=>v.toString(16).padStart(2,'0')).join('');
}

// повтор прошлого визита: услуги, цена и длительность те же, дату и время можно поправить
function repeatLast(cid){
  const v = clientVisits(cid).filter(b=>b.status==='came');
  if(!v.length){ openNew('', '', cid); return; }
  const last = v[0], avg = avgInterval(cid) || 21;
  // ближайший свободный день начиная от обычного интервала
  let d = iso(today), tm = last.time;
  for(let i=0;i<60;i++){
    const cand = fromISO(last.date); cand.setDate(cand.getDate() + avg + i);
    const k = iso(cand);
    if(k < iso(today) || isOff(k)) continue;
    if(!busyAt(k, last.time, last.min, null)){ d = k; tm = last.time; break; }
    const alt = suggestTime(k, last.min);
    if(!busyAt(k, alt, last.min, null)){ d = k; tm = alt; break; }
  }
  nb = { id:null, cid:cid, name:client(cid).name,
    sv:last.sv, svs: last.svs? last.svs.slice() : (S.services.some(x=>x.n===last.sv)? [last.sv] : []),
    price:last.price, min:last.min, pre:0,
    date:d, time:tm, status:'plan', reminded:false, note:'' };
  drawNew('Повторить визит');
  toast('Прошлый визит подставлен');
}
function openNew(date, time, cid){
  const d = date || selDay || iso(today);
  const s0 = S.services.length? S.services[0] : {n:'', p:0, m:(+S.set.defMin||60)};
  nb = { id:null, cid: cid||null, name: cid? client(cid).name : '', sv:s0.n, svs: s0.n? [s0.n] : [],
    price:s0.p, min:s0.m, pre:0,
    date:d, time: time || suggestTime(d, s0.m), status:'plan', reminded:false, note:'', phone:'' };
  drawNew('Новая запись');
}
// занято ли время: возвращает мешающую запись или null
function busyAt(date, time, min, exceptId){
  const s0 = toMin(time), e0 = s0 + (min || 60);
  return S.bookings.find(b => b.date===date && b.status!=='cancel' && b.id!==exceptId
    && s0 < toMin(b.time)+b.min && e0 > toMin(b.time)) || null;
}
function busyTap(name){ toast('Занято: '+name); }
function suggestTime(d, dur){
  const day = d || selDay || iso(today);
  const need = dur || +S.set.defMin || 60;
  const busy = dayBookings(day).filter(b=>b.status!=='cancel')
    .map(b=>[toMin(b.time), toMin(b.time)+b.min]).sort((a,b)=>a[0]-b[0]);
  let m = Math.max((+S.set.dayFrom||8)*60, 10*60);
  if(day===iso(today)){
    const now = new Date().getHours()*60 + new Date().getMinutes() + 15;
    m = Math.max(m, Math.ceil(now/15)*15);
  }
  for(let guard=0; guard<40 && m+need <= 22*60; guard++){
    const hit = busy.find(x => m < x[1] && m+need > x[0]);
    if(!hit) return fromMin(m);
    m = Math.ceil(hit[1]/15)*15;
  }
  return fromMin(Math.min(m, 21*60));
}

let newFromBook = false;
function saveBooking(){
  newFromBook = false;
  // на занятое время записать нельзя
  const bz = busyAt(nb.date, nb.time, nb.min, nb.id);
  if(bz){ toast('Это время занято: '+bz.name); return; }
  const lnk = fromLink(nb.name);
  if(lnk) nb.name = lnk;
  if(!nb.name.trim()){ toast('Впишите имя'); return; }
  // одна услуга, вписанная руками, запоминается сама; выбранные кнопками уже есть в списке
  const svName = (nb.sv||'').trim();
  if(svName && !(nb.svs||[]).length){
    const known = S.services.find(x=>x.n.toLowerCase()===svName.toLowerCase());
    if(!known) S.services.push({n:svName, p:nb.price, m:nb.min});
    else if(known.p!==nb.price || known.m!==nb.min){ known.p=nb.price; known.m=nb.min; }
    nb.sv = svName;
  }
  if(!nb.cid){
    const ex = S.clients.find(c=>c.name.toLowerCase()===nb.name.trim().toLowerCase());
    if(ex) nb.cid=ex.id;
    else {
      const typed = /^[+\d][\d\s\-()]{6,}$/.test(nb.name.trim())? nb.name.trim() : '';
      const phone = nb.phone || typed;
      const c = { id:S.nextCid++, name: (typed && !nb.phone)? 'Без имени' : nb.name.trim(),
        phone, note:'', f1:'', f2:'', regular:false, created:iso(today) };
      S.clients.push(c); nb.cid=c.id; nb.name=c.name;
      newFromBook = !!nb.phone;
    }
  }
  if(nb.id){
    const i = S.bookings.findIndex(x=>x.id===nb.id);
    S.bookings[i] = {...nb};
  } else {
    nb.id = S.nextBid++;
    S.bookings.push({...nb});
  }
  const d = nb.date, t = nb.time;
  selDay = d; closeSheet(); save(); renderAll();
  toast(newFromBook? 'Клиент добавлен в базу' : `Записано: ${relDay(d)}, ${t}`);
}

function msgFor(b){
  const c = client(b.cid), nm = (c? c.name : b.name).split(' ')[0];
  return S.set.tpl
    .replace('{имя}', nm).replace('{name}', nm)
    .replace('{когда}', relDay(b.date)).replace('{when}', relDay(b.date))
    .replace('{время}', b.time).replace('{time}', b.time)
    .replace('{услуга}', b.sv.toLowerCase()).replace('{service}', b.sv.toLowerCase());
}
function msgBack(cid){
  const c = client(cid), v = clientVisits(cid).filter(b=>b.status==='came');
  const days = v.length? dayDiff(iso(today), v[0].date) : 0;
  const dtxt = days + ' ' + plural(days,'день','дня','дней');
  const nm = c.name.split(' ')[0];
  return (S.set.tplBack || TPL_BACK.ru)
    .replace('{имя}', nm).replace('{name}', nm)
    .replace('{дней}', dtxt).replace('{days}', dtxt)
    .replace('{услуга}', v.length? v[0].sv.toLowerCase() : '').replace('{service}', v.length? v[0].sv.toLowerCase() : '');
}

let rep_ = { per:'month', exp:true, cl:false, days:true, fmt:'pdf' };
function openReport(){
  const per = [['month','Этот месяц'],['prev','Прошлый месяц'],['two','2 недели'],['quarter','Квартал']];
  sheet(`<div class="sh-h"><b>Отчёт за период</b><span class="x" onclick="closeSheet()">${ICS.cross}</span></div>
    <div class="lbl">Период</div>
    <div class="chips wrap">
      ${per.map(x=>`<button class="chip ${rep_.per===x[0]?'on':''}" onclick="rep_.per='${x[0]}';openReport()">${x[1]}</button>`).join('')}
    </div>
    <div class="lbl">Что включить</div>
    <div class="card" style="padding:4px 14px">
      <div class="sw"><div class="sw-b"><div class="sw-t">Расходы</div></div>
        <div class="tog ${rep_.exp?'on':''}" onclick="rep_.exp=!rep_.exp;openReport()"><i></i></div></div>
      <div class="sw"><div class="sw-b"><div class="sw-t">Список клиентов и визитов</div></div>
        <div class="tog ${rep_.cl?'on':''}" onclick="rep_.cl=!rep_.cl;openReport()"><i></i></div></div>
      <div class="sw"><div class="sw-b"><div class="sw-t">Количество рабочих дней</div></div>
        <div class="tog ${rep_.days?'on':''}" onclick="rep_.days=!rep_.days;openReport()"><i></i></div></div>
    </div>
    <div class="lbl">Формат</div>
    <div class="seg">
      <button class="${rep_.fmt==='pdf'?'active':''}" onclick="rep_.fmt='pdf';openReport()">PDF</button>
      <button class="${rep_.fmt==='csv'?'active':''}" onclick="rep_.fmt='csv';openReport()">CSV</button>
    </div>
    <button class="btn" style="width:100%;margin-top:18px" onclick="makeReport()">Сформировать</button>`);
}
function repRange(){
  const t = iso(today);
  if(rep_.per==='two')     return [iso(shift(-13)), t, 'последние 2 недели'];
  if(rep_.per==='quarter'){ const d=new Date(today.getFullYear(), today.getMonth()-2, 1); return [iso(d), t, 'квартал']; }
  if(rep_.per==='prev'){
    const a=new Date(today.getFullYear(), today.getMonth()-1, 1), b=new Date(today.getFullYear(), today.getMonth(), 0);
    return [iso(a), iso(b), MONN[a.getMonth()]+' '+a.getFullYear()];
  }
  const a=new Date(today.getFullYear(), today.getMonth(), 1);
  return [iso(a), t, MONN[a.getMonth()]+' '+a.getFullYear()];
}
function makeReport(){
  const [from, to, label] = repRange();
  const came = S.bookings.filter(b=>b.status==='came' && b.date>=from && b.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const inc = came.reduce((s,b)=>s+b.price,0);
  const exp = S.expenses.filter(e=>e.date>=from && e.date<=to);
  const expSum = exp.reduce((s,e)=>s+e.s,0);
  const days = new Set(came.map(b=>b.date)).size;
  const noshow = S.bookings.filter(b=>b.status==='noshow' && b.date>=from && b.date<=to).length;

  if(rep_.fmt==='csv'){
    const rows = [['Дата','Клиент','Услуга','Цена','Предоплата']];
    came.forEach(b=>rows.push([b.date, b.name, b.sv, b.price, b.pre||0]));
    rows.push([]); rows.push(['Доход', inc]);
    if(rep_.exp){ rows.push(['Расходы', expSum]); rows.push(['Осталось', inc-expSum]); }
    if(rep_.days) rows.push(['Рабочих дней', days]);
    const csv = rows.map(r=>r.join(';')).join('\n');
    try{
      const url = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
      const a = document.createElement('a');
      a.href = url; a.download = 'otchet-'+from+'-'+to+'.csv';
      document.body.appendChild(a); a.click(); a.remove();
      closeSheet(); toast('Файл CSV сохранён');
    }catch(e){
      sheet(`<div class="sh-h"><b>CSV</b><span class="x" onclick="closeSheet()">${ICS.cross}</span></div>
        <div class="msg-prev" style="font-size:11.5px">${csv}</div>`);
    }
    return;
  }

  let body = `<b style="font-size:15px">Отчёт: ${label}</b>
    <div style="font-size:12px;color:var(--muted);margin:3px 0 12px">${fmtD(from)} — ${fmtD(to)}</div>
    <div class="kv"><span>Визитов</span><b>${came.length}</b></div>
    <div class="kv"><span>Клиентов</span><b>${new Set(came.map(b=>b.cid)).size}</b></div>
    <div class="kv"><span>Доход</span><b>${money(inc)}</b></div>
    <div class="kv"><span>Средний чек</span><b>${money(came.length? inc/came.length : 0)}</b></div>
    ${noshow? `<div class="kv"><span>Не пришли</span><b>${noshow}</b></div>`:''}
    ${rep_.days? `<div class="kv"><span>Рабочих дней</span><b>${days}</b></div>`:''}
    ${rep_.exp? `<div class="kv"><span>Расходы</span><b>−${money(expSum)}</b></div>
      <div class="kv"><span>Осталось</span><b>${money(inc-expSum)}</b></div>`:''}`;
  if(rep_.cl){
    body += `<div class="lbl">Визиты</div>` + came.map(b=>
      `<div class="hist"><div class="h-d">${fmtD(b.date)}</div><div class="h-s">${b.name} · ${b.sv}</div>
       <div class="h-p">${money(b.price)}</div></div>`).join('');
  }
  sheet(`<div class="sh-h"><b>Готово</b><span class="x" onclick="closeSheet()">${ICS.cross}</span></div>
    <div class="card">${body}</div>
    <div class="w-note">Это макет страницы отчёта. В приложении кнопка сохранит настоящий PDF и предложит отправить его в мессенджер или на почту.</div>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Закрыть</button>`);
}

const TABDEF = { day:{i:'cal', l:'Записи'}, clients:{i:'ppl', l:'Клиенты'}, money:{i:'mon', l:'Сводка'} };
function tabs(){
  const order = S.set.tabs || ['day','clients','money'];
  const t = [];

    if(k==='clients' && !S.set.blkClients) return;
    if(k==='money' && !S.set.blkMoney) return;
    t.push({k, i:IC[TABDEF[k].i], l:TABDEF[k].l});
  });

}
function togTab(k){

}
// перетаскивание строки вкладки: долгое нажатие поднимает, движение переставляет
let tdr = null;
function initTabDrag(){
  const host = document.getElementById('scr-set');
  if(!host || !host.addEventListener) return;
  const start = (e, row) => {
    tdr = { k:row.getAttribute('data-k'), row, y0:e.clientY, h:row.offsetHeight || 52, moved:0, live:false,
      timer:setTimeout(()=>{ if(tdr){ tdr.live = true; row.classList.add('grab'); } }, 320) };
  };
  const move = e => {
    if(!tdr) return;
    const dy = e.clientY - tdr.y0;
    if(!tdr.live){ if(Math.abs(dy) > 8){ clearTimeout(tdr.timer); tdr = null; } return; }
    tdr.row.style.transform = 'translateY('+dy+'px)';
    tdr.moved = Math.round(dy / tdr.h);
  };
  const end = () => {
    if(!tdr) return;
    clearTimeout(tdr.timer);
    const {k, moved, live, row} = tdr;
    row.style.transform = ''; row.classList.remove('grab');
    tdr = null;
    if(live && moved) shiftTab(k, moved);
  };
  host.addEventListener('pointerdown', e=>{
    const row = e.target && e.target.closest? e.target.closest('.tab-row') : null;
    if(row && !(e.target.closest && e.target.closest('.chk'))) start(e, row);
  });
  host.addEventListener('pointermove', move);
  host.addEventListener('pointerup', end);
  host.addEventListener('pointercancel', end);
  host.addEventListener('pointerleave', end);
}
function shiftTab(k, by){
  const a = (S.set.tabs || ['day','clients','money']).slice();
  const i = a.indexOf(k);
  let j = Math.max(0, Math.min(a.length-1, i + by));
  if(i===j) return;
  a.splice(i,1); a.splice(j,0,k);
  S.set.tabs = a; save(); renderAll();
  toast('Порядок изменён');
}
function moveTab(k, dir){
  const a = (S.set.tabs || ['day','clients','money']).slice();
  const i = a.indexOf(k), j = i + dir;
  if(i<0 || j<0 || j>=a.length) return;
  a[i]=a[j]; a[j]=k;
  S.set.tabs = a; save(); renderAll();
}
function go(k){ screen=k; renderAll(); document.querySelector('main').scrollTop=0; }
function openClient(id){ openClientId=id; go('client'); }

function renderHead(){
  const T = document.getElementById('scr-title'), Sub = document.getElementById('scr-sub'),

  R.innerHTML=''; 
  if(screen==='day'){
    const d = fromISO(selDay), list = dayBookings(selDay).filter(b=>b.status!=='cancel'&&b.status!=='blocked');
    const sum = list.filter(b=>b.status==='came').reduce((s,b)=>s+b.price,0);
    T.textContent = selDay===iso(today)? L('todayCap') : relDay(selDay)[0].toUpperCase()+relDay(selDay).slice(1);
    Sub.textContent = `${DWF[d.getDay()]}, ${fmtD(selDay)} · ${list.length} ${plural(list.length,'запись','записи','записей')}`;
    R.innerHTML = `<div class="earned"><b>${money(sum)}</b><span>получено</span></div>`;
  } else if(screen==='clients'){
    T.textContent = P().clients; Sub.textContent = 'база на телефоне, никуда не уходит';
  } else if(screen==='client'){
    T.textContent = 'Карточка'; Sub.textContent = '';
  } else if(screen==='money'){
    T.textContent = 'Сводка'; Sub.textContent = 'деньги и клиенты по месяцам';
  } else if(screen==='book'){
    const b = S.bookings.find(x=>x.id===openBookId);
    T.textContent = b? (b.status==='blocked'? 'Личное время' : 'Запись') : 'Запись';
    Sub.textContent = b? relDay(b.date)+', '+b.time+'–'+fromMin(toMin(b.time)+b.min) : '';
  } else if(screen==='mdet'){
    const d = monthKey(monthOff);
    T.textContent = mdTitle(); Sub.textContent = MONN[d.getMonth()] + ' ' + d.getFullYear();
  } else if(screen==='set'){
    T.textContent = setTitle(); Sub.textContent = '';

    T.textContent = 'Ещё'; Sub.textContent = 'настройки и услуги';
    R.innerHTML = `<span class="badge">ПРОТОТИП</span>`;
  }
  document.getElementById('fab').style.display = (screen==='day'||screen==='clients')? 'block':'none';

function renderAll(){
  applyTheme();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

}
// ---------- перевод интерфейса по разметке ----------
function trText(t){
  if(loc()!=='en' || !t || !/[А-Яа-яЁё]/.test(t)) return t;
  const key = t.trim();
  if(EN[key]) return t.replace(key, EN[key]);
  const flat = key.replace(/\s+/g, ' ');
  for(const k in EN){ if(k.replace(/\s+/g,' ') === flat) return EN[k]; }
  let out = t;
  for(let i=0;i<RULES.length;i++) out = out.replace(RULES[i][0], RULES[i][1]);
  return out;
}
function trDOM(root){
  if(loc()!=='en' || !root || !root.querySelectorAll) return;
  if(typeof document.createTreeWalker === 'function'){
    const w = document.createTreeWalker(root, 4 /* SHOW_TEXT */);
    const nodes = [];
    while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(n=>{ const v = trText(n.nodeValue); if(v!==n.nodeValue) n.nodeValue = v; });
  }
  root.querySelectorAll('[placeholder]').forEach(el=>{ el.placeholder = trText(el.placeholder); });
}
function trAll(){
  ['scr-day','scr-clients','scr-client','scr-money','scr-more','nav','sheet','scr-title','scr-sub','head-right']
    .forEach(id=>trDOM(document.getElementById(id)));
}
let toastT;
function toast(m, undoable){
  const el = document.getElementById('toast');
  const msg = '<div class="t-msg">' + trText(m) + '</div>';
  if(undoable){
    el.innerHTML = msg + '<div class="undo" onclick="doUndo()">' + (loc()==='en'? 'Undo':'Отменить') + '</div>';
    el.classList.add('act');
  } else {
    el.innerHTML = msg;
    el.classList.remove('act');
  }
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>{ el.classList.remove('show'); el.classList.remove('act'); }, undoable? 6000 : 2200);
}
// снимок состояния перед необратимым действием
let undoSnap = null;
function snap(){ try{ undoSnap = JSON.stringify(S); }catch(e){ undoSnap = null; } }
function doUndo(){
  if(!undoSnap){ toast('Нечего отменять'); return; }
  S = JSON.parse(undoSnap); undoSnap = null;
  save(); applyLang(); renderAll();
  toast('Возвращено');
}
