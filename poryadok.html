<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Порядок">
<meta name="theme-color" content="#0f1115">
<title>Порядок — органайзер</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --line:#2c313c;
    --text:#e8eaf0; --muted:#8b93a3;
    --accent:#5b8cff; --accent2:#7ea6ff; --on-accent:#ffffff;
    --accent-soft:rgba(91,140,255,.14); --glow:rgba(91,140,255,.35);
    --green:#3ecf8e; --red:#ff6b6b; --amber:#ffb84d;
    --radius:16px;
  }
  #phone.light{
    --bg:#f2f4f8; --card:#ffffff; --card2:#e9edf4; --line:#dde3ec;
    --text:#1b1f27; --muted:#69717f;
  }
  #phone.light nav{background:rgba(255,255,255,.96);}
  #phone.light #toast{background:#3a4152;}
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#000; display:flex; justify-content:center; align-items:center;
  }
  #phone{
    width:100%; max-width:420px; height:100vh; max-height:920px;
    background:var(--bg); color:var(--text); position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  @media(min-width:500px){ #phone{border-radius:36px; border:1px solid #2a2a2a; height:92vh;} }
  #phone svg{max-width:100%; max-height:100%; display:block;}

  header{
    padding:calc(14px + env(safe-area-inset-top, 0px)) 20px 10px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:10px;
  }
  header h1{font-size:24px; font-weight:700;}
  header .sub{color:var(--muted); font-size:13px; margin-top:2px;}

  main{flex:1; overflow-y:auto; padding:6px 16px 120px;}

  /* ---- вкладки снизу: контурные иконки ---- */
  nav{
    position:absolute; bottom:0; left:0; right:0;
    height:calc(64px + env(safe-area-inset-bottom, 0px));
    padding-bottom:env(safe-area-inset-bottom, 0px);
    background:rgba(20,23,29,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex; z-index:30;
  }
  nav button{
    flex:1; background:none; border:none; color:var(--muted); font-size:10.5px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    cursor:pointer; font-family:inherit; position:relative;
  }
  nav button .ico{width:23px; height:23px; display:flex;}
  nav button .ico svg{width:23px; height:23px;}
  nav button.active{color:var(--accent); font-weight:600;}

  #fab{
    position:absolute; right:18px; bottom:calc(84px + env(safe-area-inset-bottom, 0px));
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center;
    border:none; box-shadow:0 10px 26px var(--glow); cursor:pointer; z-index:31;
  }
  #fab svg{width:24px; height:24px;}

  .screen{display:none;}
  .screen.active{display:block;}
  h2.section{font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:18px 4px 8px;}
  .back{background:none; border:none; color:var(--accent); font-size:15px; cursor:pointer; padding:6px 0; margin-bottom:4px; font-family:inherit;}

  /* ---- задачи ---- */
  .task{
    background:var(--card); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;
    display:flex; gap:12px; align-items:flex-start; border:1px solid transparent;
    position:relative; touch-action:pan-y; transition:transform .15s;
    user-select:none; -webkit-user-select:none;
  }
  .task.overdue{border-color:rgba(255,107,107,.35);}
  .chk{
    width:24px; height:24px; min-width:24px; border-radius:50%; border:2px solid var(--muted);
    cursor:pointer; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff;
    transition:.15s;
  }
  .chk svg{width:13px; height:13px;}
  .task.done .chk{background:var(--green); border-color:var(--green);}
  .task.done .t-title{text-decoration:line-through; color:var(--muted);}
  .t-body{flex:1; min-width:0;}
  .t-title{font-size:15px; line-height:1.35;}
  .t-meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .t-meta .urgent{color:var(--red);}
  .t-meta .proj{color:var(--accent);}
  .t-meta .bell-m{color:var(--amber);}
  .mi{display:inline-flex; width:13px; height:13px; vertical-align:-2px; margin-right:3px;}
  .mi svg{width:13px; height:13px;}
  .t-meta span{display:inline-flex; align-items:center;}
  .empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}
  .t-swipe-act{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    display:none; gap:6px; z-index:2;
  }
  .task.swiped .t-swipe-act{display:flex;}
  .sw-btn{border:none; border-radius:10px; padding:8px 10px; font-size:12px; cursor:pointer; background:var(--card2); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.35); font-family:inherit; display:flex; align-items:center; gap:4px;}
  .sw-btn svg{width:14px; height:14px;}
  .sw-btn.danger{color:var(--red);}
  .ov-act{display:flex; gap:6px; margin-top:7px;}
  .ov-act button{border:1px solid var(--line); background:var(--card2); color:var(--text); border-radius:10px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit;}

  /* ---- лента дней (как в Записано) ---- */
  .weekstrip{
    display:flex; gap:8px; margin:8px -16px 10px; padding:3px 16px 6px;
    overflow-x:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x;
    scrollbar-width:none; overscroll-behavior-x:contain; user-select:none; -webkit-user-select:none;
  }
  .weekstrip::-webkit-scrollbar{display:none;}
  .wd{
    flex:0 0 66px; background:var(--card); border-radius:15px; padding:9px 2px 8px;
    text-align:center; cursor:pointer; transition:transform .12s;
  }
  .wd:active{transform:scale(.95);}
  .wd .dw{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.2px; white-space:nowrap; overflow:hidden;}
  .wd .dn{font-size:14.5px; font-weight:650; margin-top:2px; font-variant-numeric:tabular-nums;}
  .wd .load{height:3px; border-radius:2px; margin:6px 8px 0; background:var(--card2); overflow:hidden;}
  .wd .load i{display:block; height:100%; border-radius:2px; background:var(--accent);}
  .wd.sel{background:var(--accent);}
  .wd.sel .dw{color:rgba(255,255,255,.75);}
  .wd.sel .dn{color:#fff;}
  .wd.sel .load{background:rgba(255,255,255,.25);}
  .wd.today:not(.sel) .dn{color:var(--accent);}

  /* ---- проекты ---- */
  .proj-card{background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:10px; cursor:pointer;}
  .proj-card .p-head{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .proj-card .p-name{font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px; min-width:0;}
  .proj-card .p-name .pi{width:18px; height:18px; min-width:18px; color:var(--accent);}
  .proj-card .p-name .pi svg{width:18px; height:18px;}
  .proj-card .p-pct{font-size:13px; color:var(--accent); font-weight:600; white-space:nowrap;}
  .p-next{font-size:12px; color:var(--muted); margin-top:8px;}
  .p-actions{display:flex; gap:6px;}
  .p-actions button{
    width:30px; height:30px; border:none; border-radius:9px; background:var(--card2);
    color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .p-actions button svg{width:15px; height:15px;}
  .p-actions button.danger{color:var(--red);}
  .proj-card.p-done{opacity:.55;}
  .stage{background:var(--card); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .stage-head{padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .stage-head .s-name{font-weight:600; font-size:14px;}
  .stage-head .s-cnt{font-size:12px; color:var(--muted);}
  .stage-body{border-top:1px solid var(--line); padding:6px 14px 10px; display:none;}
  .stage.open .stage-body{display:block;}
  .sub-t{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line);}
  .sub-t:last-child{border-bottom:none;}
  .sub-t .chk{width:20px; height:20px; min-width:20px;}
  .sub-t .chk svg{width:11px; height:11px;}
  .sub-t.done span.st-t{text-decoration:line-through; color:var(--muted);}
  .sub-t span.st-t{font-size:14px; line-height:1.4; flex:1;}
  .add-sub{
    margin-left:auto; background:var(--card2); border:none; color:var(--muted);
    width:26px; height:26px; min-width:26px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .add-sub svg{width:13px; height:13px;}
  .sub-add-row{display:flex; gap:6px; padding:6px 0 8px;}
  .sub-add-row input{flex:1; min-width:0; background:var(--bg); border:1px solid var(--accent); border-radius:10px; color:var(--text); padding:8px 10px; font-size:14px; outline:none; font-family:inherit;}
  .sub-add-row button{background:var(--accent); border:none; color:var(--on-accent); border-radius:10px; width:36px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .sub-add-row button svg{width:14px; height:14px;}
  .sub-add-row button.cancel{background:var(--card2); color:var(--muted);}
  .sub-add-row button.cancel.danger{color:var(--red);}
  .stage-add{color:var(--accent); font-size:13px; padding:8px 0 2px; cursor:pointer;}

  /* ---- настройки: группы строк (как в Записано) ---- */
  .group{background:var(--card); border-radius:var(--radius); margin-bottom:14px; overflow:hidden;}
  .row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .row:last-child{border-bottom:none;}
  .row-ic{
    width:34px; height:34px; min-width:34px; border-radius:11px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; color:var(--accent);
  }
  .row-ic svg{width:17px; height:17px;}
  .row-t{flex:1; font-size:15px;}
  .row-v{font-size:13px; color:var(--muted); max-width:40%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-ch{color:var(--muted); font-size:17px;}
  .toggle-row{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:8px; font-size:14px;}
  .tg{width:44px; height:26px; min-width:44px; border-radius:13px; background:var(--card2); position:relative; cursor:pointer; transition:.2s;}
  .tg::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:.2s;}
  .tg.on{background:var(--accent);}
  .tg.on::after{left:21px; background:#fff;}
  .sw-d{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4;}

  /* палитра цветов */
  .pal{display:flex; gap:11px; flex-wrap:wrap; padding:4px 2px;}
  .pal-c{
    width:38px; height:38px; border-radius:50%; cursor:pointer; position:relative;
    border:3px solid transparent; background-clip:padding-box;
  }
  .pal-c.on{box-shadow:0 0 0 2.5px var(--bg), 0 0 0 5px var(--accent);}
  .pal-own{display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .pal-own input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .pal-own span{color:#fff; font-size:18px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.4); pointer-events:none;}
  .icon-preview{display:flex; gap:14px; align-items:center; margin:2px 4px 12px;}

  .pick{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .pick:last-child{border-bottom:none;}
  .pick-n{font-size:15px;}
  .pick-s{font-size:12px; color:var(--muted); margin-top:2px;}
  .pick-ck{margin-left:auto; color:var(--accent); font-weight:700;}

  /* сегменты */
  .seg{display:flex; background:var(--card); border-radius:14px; padding:4px; margin-bottom:8px;}
  .seg button{flex:1; border:none; background:none; color:var(--muted); font-size:13px; padding:9px 0; border-radius:10px; cursor:pointer; font-family:inherit;}
  .seg button.active{background:var(--accent); color:var(--on-accent); font-weight:600;}

  /* ---- виджеты (макеты размеров) ---- */
  .wsize{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:16px 4px 8px;}
  .wgt{
    border-radius:20px; padding:13px 15px; background:var(--card);
    border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,.25); margin-bottom:4px;
  }
  #phone.light .wgt{box-shadow:0 8px 24px rgba(60,80,120,.12);}
  .wgt.w21{width:190px;}
  .wgt.w22{width:190px; min-height:170px; display:flex; flex-direction:column;}
  .wgt-h{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;}
  .wgt-h h4{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600;}
  .wgt-add{
    width:28px; height:28px; min-width:28px; border-radius:50%; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px var(--glow);
    border:none; cursor:pointer;
  }
  .wgt-add svg{width:14px; height:14px;}
  .w-task{display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; min-width:0;}
  .w-task .wc{width:14px; height:14px; min-width:14px; border:1.5px solid var(--muted); border-radius:50%;}
  .w-task.wdone .wc{background:var(--green); border-color:var(--green);}
  .w-task.wdone{color:var(--muted); text-decoration:line-through;}
  .w-task .wt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wbig{font-size:25px; font-weight:700; letter-spacing:-.8px; line-height:1;}
  .w-note{font-size:11px; color:var(--muted); margin:8px 4px 14px; line-height:1.45;}

  /* ---- шторка ---- */
  #sheet-bg{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:40; display:none;}
  #sheet{
    position:absolute; left:0; right:0; bottom:-105%; z-index:41;
    background:var(--card2); border-radius:24px 24px 0 0;
    padding:18px 18px calc(26px + env(safe-area-inset-bottom, 0px));
    transition:bottom .25s ease; max-height:88%; overflow-y:auto;
  }
  #sheet.up{bottom:0;}
  #sheet h3{font-size:16px;}
  #sheet-close{
    width:34px; height:34px; border:none; border-radius:50%;
    background:var(--card); color:var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #sheet-close svg{width:14px; height:14px;}
  .input-row{display:flex; gap:8px;}
  #q-input{
    flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:14px;
    color:var(--text); font-size:16px; padding:13px 14px; outline:none; font-family:inherit;
  }
  #q-input:focus{border-color:var(--accent);}
  #mic-btn{
    width:50px; min-width:50px; height:50px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #mic-btn svg{width:20px; height:20px;}
  #mic-btn.rec{background:var(--red); border-color:var(--red); color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.55;}}
  .hint{font-size:11px; color:var(--muted); margin:6px 2px 12px;}
  #note-input{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:14px;
    color:var(--text); font-size:14px; padding:10px 14px; margin:2px 0 8px; outline:none;
    resize:none; font-family:inherit;
  }
  #note-input:focus{border-color:var(--accent);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    white-space:nowrap; border:1px solid var(--line); background:var(--card); color:var(--text);
    border-radius:20px; padding:8px 14px; font-size:13px; cursor:pointer; flex:0 0 auto;
  }
  .chip small{display:block; font-size:9px; color:var(--muted); text-align:center; text-transform:uppercase; margin-bottom:1px;}
  .chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chip.sel small{color:rgba(255,255,255,.75);}
  .row-label{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:10px 2px 6px;}
  #time-slider-box{
    background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:10px 14px 6px; margin-bottom:6px; display:none;
  }
  #time-slider{width:100%; accent-color:var(--accent); height:28px; cursor:pointer; margin:0;}
  .sheet-btns{display:flex; gap:8px; margin-top:14px;}
  #add-btn{
    flex:2; background:var(--accent); border:none; color:var(--on-accent);
    font-size:16px; font-weight:600; padding:14px; border-radius:14px; cursor:pointer;
    box-shadow:0 6px 16px var(--glow); font-family:inherit;
  }
  #del-btn{
    flex:1; background:var(--card); border:1px solid var(--line); color:var(--red);
    font-size:14px; padding:14px 6px; border-radius:14px; cursor:pointer; font-family:inherit;
  }
  #parsed{font-size:12px; color:var(--green); margin-top:8px; min-height:16px;}

  /* мини-календарь */
  .mini-cal{background:var(--card); border-radius:16px; padding:12px; margin-bottom:12px;}
  .mc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .mc-head b{font-size:14px; text-transform:capitalize;}
  .mc-head button{background:var(--card2); border:none; color:var(--text); width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:15px;}
  .mc-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
  .mc-grid .dw{font-size:10px; color:var(--muted); padding:4px 0; text-transform:uppercase;}
  .mc-d{padding:8px 0 10px; border-radius:10px; font-size:13px; cursor:pointer; position:relative;}
  .mc-d.other{color:var(--muted); opacity:.4;}
  .mc-d.today{color:var(--accent); font-weight:700;}
  .mc-d.sel{background:var(--accent); color:#fff;}
  .mc-d .mdot{position:absolute; left:0; right:0; bottom:2px; font-size:7px; color:var(--accent); line-height:1;}
  .mc-d.sel .mdot{color:#fff;}

  /* подтверждение */
  #confirm-bg{
    position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:60;
    display:none; align-items:center; justify-content:center; padding:30px;
  }
  #confirm-box{background:var(--card2); border-radius:20px; padding:20px; width:100%; max-width:320px;}
  #confirm-text{font-size:15px; line-height:1.45;}
  .cf-btn{flex:1; border:none; border-radius:12px; padding:12px; font-size:15px; cursor:pointer; background:var(--card); color:var(--text); font-family:inherit;}
  .cf-btn.danger{background:var(--red); color:#fff; font-weight:600;}

  #toast{
    position:absolute; left:50%; transform:translateX(-50%); bottom:150px; z-index:50;
    background:#2c3140; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
    opacity:0; transition:.3s; pointer-events:none; white-space:nowrap; max-width:90%;
    overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>
<div id="phone">
  <header>
    <div>
      <h1 id="scr-title">Сегодня</h1>
      <div class="sub" id="scr-sub"></div>
    </div>
  </header>

  <main>
    <section class="screen active" id="scr-today"></section>
    <section class="screen" id="scr-cal">
      <div class="weekstrip" id="weekstrip"></div>
      <div id="monthwrap" style="display:none"></div>
      <button class="back" id="cal-expand" onclick="toggleMonth()" style="margin:0 0 8px"></button>
      <div id="cal-list"></div>
    </section>
    <section class="screen" id="scr-proj"></section>
    <section class="screen" id="scr-more"></section>
    <section class="screen" id="scr-set"></section>
  </main>

  <button id="fab" onclick="openSheet()"></button>

  <nav id="navbar"></nav>

  <div id="sheet-bg" onclick="closeSheet()"></div>
  <div id="sheet">

// ===================== цвет оформления =====================
function shade(hex, p){ // p>0 светлее, p<0 темнее
  const n=parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const f=c=> Math.round(p>0 ? c+(255-c)*p : c*(1+p));
  return '#'+[f(r),f(g),f(b)].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('');
}
function rgbaOf(hex, a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}
function applyAccent(){
  const el = document.getElementById('phone');
  el.style.setProperty('--accent', SET.accent);
  el.style.setProperty('--accent2', shade(SET.accent,.22));
  el.style.setProperty('--accent-soft', rgbaOf(SET.accent, isDark()? .16 : .11));
  el.style.setProperty('--glow', rgbaOf(SET.accent, .35));
}
function setAccentHex(hex){
  SET.accent = hex;
  if(SET.link !== false) SET.icon = hex;
  applyAccent(); saveState();
  if(screen==='set') renderSet();
  toast(t('colorUpdated'));
}
function setIconHex(hex){ SET.icon = hex; saveState(); if(screen==='set') renderSet(); toast(t('colorUpdated')); }
const mqLight = window.matchMedia('(prefers-color-scheme: light)');
function isDark(){ return !(SET.theme==='light' || (SET.theme==='auto' && mqLight.matches)); }
function applyTheme(){
  document.getElementById('phone').classList.toggle('light', !isDark());
  try{
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', isDark()?'#0f1115':'#f2f4f8');
  }catch(e){}
  applyAccent();
}
function setTheme(th){
  SET.theme=th; applyTheme(); saveState();
  if(screen==='set') renderSet();
  toast(STR.themeSet[th][lang()==='en'?1:0]);
}
mqLight.addEventListener('change', applyTheme);
function setLang(l){

  renderNav(); renderAll(); buildSheetLabels();
  toast(t('langUpdated'));
}

  document.getElementById('navbar').innerHTML = tabs.map(([s,ic,k])=>
    `<button class="${(screen===s || (s==='more'&&screen==='set'))?'active':''}" onclick="go('${s}')">
      <span class="ico">${ICS[ic]}</span>${t(k)}</button>`).join('');
  document.getElementById('fab').innerHTML = ICS.plus;
}
function headerFor(){
  if(screen==='today') return [t('today'), fmt(today)+', '+DL().DWF[today.getDay()]];
  if(screen==='cal') return [t('calendar'), t('planWeek')];
  if(screen==='proj') return [t('projects'), t('projSub')];
  if(screen==='more') return [t('more'), t('moreSub')];
  if(screen==='set') return [t(setTitleKey()), ''];
  return ['',''];
}
function setTitleKey(){ return ({look:'setLook',lang:'setLang',notif:'setNotif',wgt:'setWgt',data:'setData'})[setPage]||'more'; }
function go(s){
  screen=s;

function openSet(p){ setPage=p; go('set'); }
function rerenderAll(){ renderToday(); renderCal(); renderProjects(); if(screen==='more') renderMore(); if(screen==='set') renderSet(); }
function renderAll(){ go(screen); }

// ===================== задачи: рендер =====================
const REP_KEYS={d:'repD', w:'repW', m:'repM', q:'repQ', y:'repY'};
function bellMeta(x){
  if(!x.remind) return null;
  let txt = (x.remBefore && x.remBefore.length)
    ? t('minBefore',{n:x.remBefore.join('/')})
    : t('remindMeta');
  return `<span class="bell-m">${mi('bell')}${txt}${x.remPersist? ' '+mi('repeat'):''}</span>`;
}
function commonMeta(x, title){
  let meta=[];
  const dateKey = x.date, done = x.done;
  const overdue = dateKey && dateKey < iso(today) && !done;
  if(overdue) meta.push(`<span class="urgent">${t('overdueMeta')} · ${fmt(fromISO(dateKey))}</span>`);
  if(x.time) meta.push(`<span>${mi('clock')}${x.time}</span>`);
  const bm=bellMeta(x); if(bm) meta.push(bm);
  if(x.repeat) meta.push(`<span>${mi('repeat')}${t(REP_KEYS[x.repeat])}</span>`);
  if(x.note) meta.push(`<span>${mi('doc')}${x.note.length>26? x.note.slice(0,26)+'…':x.note}</span>`);
  return meta;
}
function taskHTML(x){
  const overdue = x.date < iso(today) && !x.done;
  let meta = commonMeta(x);
  if(x.proj) meta.push(`<span class="proj">${mi('folder')}${x.proj}</span>`);
  return `<div class="task ${x.done?'done':''} ${overdue?'overdue':''}" data-tid="${x.id}">
    <div class="chk" onclick="toggle(${x.id})">${x.done?ICS.ok:''}</div>
    <div class="t-body" onclick="openEdit(${x.id})" style="cursor:pointer"><div class="t-title">${x.title}</div>
    ${meta.length?'<div class="t-meta">'+meta.join(' ')+'</div>':''}
    ${overdue?`<div class="ov-act">
      <button onclick="event.stopPropagation();moveTask(${x.id},0)">${t('toSelToday')}</button>
      <button onclick="event.stopPropagation();moveTask(${x.id},1)">${t('toTomorrow')}</button></div>`:''}</div>
    <div class="t-swipe-act">
      <button class="sw-btn" onclick="event.stopPropagation();moveTask(${x.id},1)">${t('toTomorrow')}</button>
      <button class="sw-btn danger" onclick="event.stopPropagation();swDeleteTask(${x.id})">${ICS.trash}</button>
    </div></div>`;
}
function projTaskHTML(x){
  const it=x.item;
  const overdue = it.date < iso(today) && !it.done;
  let meta = commonMeta(it);
  meta.push(`<span class="proj">${mi('folder')}${x.proj}</span>`);
  const ref=`${x.pid},${x.si},'${x.path}'`;
  return `<div class="task ${it.done?'done':''} ${overdue?'overdue':''}" data-ref="${x.pid}|${x.si}|${x.path}">
    <div class="chk" onclick="tgItem(${ref})">${it.done?ICS.ok:''}</div>
    <div class="t-body" onclick="openEditProj(${ref})" style="cursor:pointer">
      <div class="t-title">${it.t}</div><div class="t-meta">${meta.join(' ')}</div>
      ${overdue?`<div class="ov-act">
        <button onclick="event.stopPropagation();moveProjTask(${ref},0)">${t('toSelToday')}</button>
        <button onclick="event.stopPropagation();moveProjTask(${ref},1)">${t('toTomorrow')}</button></div>`:''}</div>
    <div class="t-swipe-act">
      <button class="sw-btn" onclick="event.stopPropagation();moveProjTask(${ref},1)">${t('toTomorrow')}</button>
      <button class="sw-btn danger" onclick="event.stopPropagation();delProjItem(${ref});toast(t('taskDeleted'))">${ICS.trash}</button>
    </div></div>`;
}
function renderToday(){
  const el=document.getElementById('scr-today');
  const pd=datedProjItems();
  const over=tasks.filter(x=>x.date<iso(today)&&!x.done), overP=pd.filter(x=>x.item.date<iso(today)&&!x.item.done);
  const cur=tasks.filter(x=>x.date===iso(today)), curP=pd.filter(x=>x.item.date===iso(today));
  const tom=tasks.filter(x=>x.date===iso(d(1))), tomP=pd.filter(x=>x.item.date===iso(d(1)));
  let h='';
  if(over.length+overP.length) h+=`<h2 class="section">${t('overdue')}</h2>`+over.map(taskHTML).join('')+overP.map(projTaskHTML).join('');
  h+=`<h2 class="section">${t('today')}</h2>`;
  h+=(cur.length+curP.length)? cur.map(taskHTML).join('')+curP.map(projTaskHTML).join('') : `<div class="empty">${t('allDone')}</div>`;
  if(tom.length+tomP.length) h+=`<h2 class="section">${t('tomorrow')}</h2>`+tom.map(taskHTML).join('')+tomP.map(projTaskHTML).join('');
  el.innerHTML=h;
}
function nextRepeatDate(x){
  const dt=fromISO(x.date);
  if(x.repeat==='d') dt.setDate(dt.getDate()+1);
  if(x.repeat==='w') dt.setDate(dt.getDate()+7);
  if(x.repeat==='m') dt.setMonth(dt.getMonth()+1);
  if(x.repeat==='q') dt.setMonth(dt.getMonth()+3);
  if(x.repeat==='y') dt.setFullYear(dt.getFullYear()+1);
  return iso(dt);
}
function toggle(id){
  const x=tasks.find(v=>v.id===id); if(!x) return;
  x.done=!x.done;
  if(x.done && x.repeat){
    const nd=nextRepeatDate(x);
    tasks.push({...x, id:++taskId, date:nd, done:false});
    toast(t('willRepeat',{d:fmt(fromISO(nd))}));
  } else if(x.done) toast(t('done1'));
  rerenderAll(); saveState();
}
function moveTask(id,off){
  const x=tasks.find(v=>v.id===id); if(!x) return;
  x.date=iso(d(off));
  rerenderAll(); saveState();
  toast(t('movedTo',{d:(off===0?DL().todayCap:DL().tomorrowCap.toLowerCase())}));
}
function swDeleteTask(id){ tasks=tasks.filter(x=>x.id!==id); rerenderAll(); saveState(); toast(t('taskDeleted')); }

// ===================== календарь: лента дней =====================
let selDay=iso(today);
let calExpanded=false, calY=today.getFullYear(), calM=today.getMonth();
let stripScroll=null, lastSel=null;
function openCount(key){
  return tasks.filter(x=>x.date===key&&!x.done).length +
         datedProjItems().filter(x=>x.item.date===key&&!x.item.done).length;
}
function renderCal(){
  const ws=document.getElementById('weekstrip'), mw=document.getElementById('monthwrap'), ex=document.getElementById('cal-expand');
  if(calExpanded){
    ws.style.display='none'; mw.style.display='block';
    mw.innerHTML='<div class="mini-cal">'+monthGridHTML(calY,calM,selDay,'calPick','calNav')+'</div>';
    ex.textContent=t('collapseMonth');
  } else {
    ws.style.display='flex'; mw.style.display='none';
    ex.textContent=t('expandMonth');
    // длинная лента: прокручивается пальцем, выбор не съезжает (как в «Записано»)
    let h='';
    for(let i=-30;i<=120;i++){
      const dt=d(i), key=iso(dt);
      const cnt=openCount(key);
      h+=`<div class="wd ${key===selDay?'sel':''} ${key===iso(today)?'today':''}" data-k="${key}" onclick="calPick('${key}')">
        <div class="dw">${key===iso(today)? DL().todayCap : DL().DW[dt.getDay()]}</div>
        <div class="dn">${dt.getDate()}.${String(dt.getMonth()+1).padStart(2,'0')}</div>
        <div class="load"><i style="width:${Math.min(100,cnt*25)}%"></i></div></div>`;
    }
    ws.innerHTML=h;
    syncStrip();
  }
  const list=tasks.filter(x=>x.date===selDay);
  const listP=datedProjItems().filter(x=>x.item.date===selDay);
  const selDt=fromISO(selDay);
  document.getElementById('cal-list').innerHTML =
    `<h2 class="section">${selDay===iso(today)? t('today') : fmt(selDt)+', '+DL().DWF[selDt.getDay()]}</h2>` +
    ((list.length+listP.length)? list.map(taskHTML).join('')+listP.map(projTaskHTML).join('') : `<div class="empty">${t('emptyDay')}</div>`);
}
function syncStrip(){
  const rail=document.getElementById('weekstrip');
  if(rail.offsetParent===null) return; // экран скрыт — не трогаем прокрутку
  if(!rail._bound){ rail._bound=true; rail.addEventListener('scroll',()=>{ if(rail.offsetParent!==null) stripScroll=rail.scrollLeft; },{passive:true}); }
  const sel=rail.querySelector('.wd.sel');
  const changed = lastSel!==selDay; lastSel=selDay;
  if(stripScroll===null){
    if(sel) rail.scrollLeft=Math.max(0, sel.offsetLeft-16);
    stripScroll=rail.scrollLeft;
    return;
  }
  rail.scrollLeft=stripScroll;
  if(!changed || !sel) return;
  const l=sel.offsetLeft-16, r=l+sel.offsetWidth+16;
  if(l<rail.scrollLeft || r>rail.scrollLeft+rail.clientWidth){
    rail.scrollLeft=Math.max(0,l); stripScroll=rail.scrollLeft;
  }
}
function calPick(key){ selDay=key; renderCal(); }
function calNav(dir){ const x=new Date(calY,calM+dir,1); calY=x.getFullYear(); calM=x.getMonth(); renderCal(); }
function toggleMonth(){
  calExpanded=!calExpanded;
  if(calExpanded){ const dt=fromISO(selDay); calY=dt.getFullYear(); calM=dt.getMonth(); }
  renderCal();
}
function monthGridHTML(y,m,selISO,pickFn,navFn){
  const first=new Date(y,m,1);
  const name=first.toLocaleDateString(lang()==='en'?'en-US':'ru-RU',{month:'long',year:'numeric'}).replace(' г.','');
  const start=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  function cell(dt,other){
    const key=iso(dt);
    const cnt=openCount(key);
    const cls='mc-d'+(other?' other':'')+(key===iso(today)?' today':'')+(key===selISO?' sel':'');
    return `<div class="${cls}" onclick="${pickFn}('${key}')">${dt.getDate()}<div class="mdot">${'•'.repeat(Math.min(cnt,3))}</div></div>`;
  }
  const wd = lang()==='en' ? ['mo','tu','we','th','fr','sa','su'] : ['пн','вт','ср','чт','пт','сб','вс'];
  let h=`<div class="mc-head"><button onclick="${navFn}(-1)">‹</button><b>${name}</b><button onclick="${navFn}(1)">›</button></div><div class="mc-grid">`;
  wd.forEach(x=>h+=`<div class="dw">${x}</div>`);
  for(let i=0;i<start;i++) h+=cell(new Date(y,m,i-start+1),true);
  for(let dd=1;dd<=dim;dd++) h+=cell(new Date(y,m,dd),false);
  const trail=(7-(start+dim)%7)%7;
  for(let i=1;i<=trail;i++) h+=cell(new Date(y,m+1,i),true);
  return h+'</div>';
}

// ===================== проекты =====================
function countItem(i){ let all=1, done=i.done?1:0; (i.subs||[]).forEach(s=>{const c=countItem(s); all+=c.all; done+=c.done;}); return {all,done}; }
function projStats(p){ let all=0,done=0; p.stages.forEach(s=>s.items.forEach(i=>{const c=countItem(i); all+=c.all; done+=c.done;})); return {all,done}; }
function firstOpen(i){ if(!i.done) return i.t; for(const s of (i.subs||[])){const r=firstOpen(s); if(r) return r;} return null; }
function nextStep(p){
  for(const s of p.stages) for(const i of s.items){ const r=firstOpen(i); if(r) return s.name+' → '+r; }
  return projStats(p).all===0 ? t('addFirst') : t('allTasksDone');
}
function getItem(stage,path){
  const idx=path.split('.').map(Number);
  let it=stage.items[idx[0]];
  for(let k=1;k<idx.length;k++) it=it.subs[idx[k]];
  return it;
}
function datedProjItems(){
  const out=[];
  projects.filter(p=>!p.done).forEach(p=>p.stages.forEach((s,si)=>{
    const walk=(i,path)=>{ if(i.date) out.push({pid:p.id,si,path,item:i,proj:p.name}); (i.subs||[]).forEach((x,xi)=>walk(x,path+'.'+xi)); };
    s.items.forEach((i,ii)=>walk(i,String(ii)));
  }));
  return out;
}
let stageEdit=null, newStageMode=false, newProjMode=false, projRenameMode=false, projListEdit=null, editTarget=null;
function resetPEdits(){ stageEdit=null; newStageMode=false; newProjMode=false; projRenameMode=false; projListEdit=null; editTarget=null; }
function cancelPEdits(){ resetPEdits(); renderProjects(); }
function inlineRow(confirmFn, delFn){
  return `<div class="sub-add-row">
    <input id="ren-input" onkeydown="if(event.key==='Enter')${confirmFn}();if(event.key==='Escape')cancelPEdits()">
    <button onclick="${confirmFn}()">${ICS.ok}</button>` +
    (delFn?`<button class="cancel danger" onclick="${delFn}()">${ICS.trash}</button>`:'') +
    `<button class="cancel" onclick="cancelPEdits()">${ICS.cross}</button></div>`;
}
function focusRen(val){
  setTimeout(()=>{ const el=document.getElementById('ren-input');
    if(el){ if(val!==undefined){ el.value=val; el.select(); } el.focus(); } },60);
}
function renderProjects(){
  const el=document.getElementById('scr-proj');
  if(curProj===null){
    const projCard=p=>{
      if(projListEdit===p.id) return `<div class="proj-card" style="cursor:default">${inlineRow('confirmListRename','deleteProjFromRename')}</div>`;
      const st=projStats(p), left=st.all-st.done;
      return `<div class="proj-card ${p.done?'p-done':''}" onclick="resetPEdits();curProj=${p.id};renderProjects()">
        <div class="p-head"><div class="p-name"><span class="pi">${ICS.folder}</span>${p.name}</div>
          <div class="p-actions">
            <button onclick="event.stopPropagation();startListRename(${p.id})">${ICS.pencil}</button>
            <button onclick="event.stopPropagation();toggleProjDone(${p.id})">${p.done?ICS.undo:ICS.ok}</button>
            <button class="danger" onclick="event.stopPropagation();deleteProjById(${p.id})">${ICS.trash}</button>
          </div></div>
        <div class="p-next">${p.done ? t('projDone') : (left? t('leftN',{n:left})+' · ':'') + t('nextStep')+': '+nextStep(p)}</div></div>`;
    };
    const act=projects.filter(p=>!p.done), doneP=projects.filter(p=>p.done);
    el.innerHTML = act.map(projCard).join('') +
      (newProjMode ? inlineRow('confirmNewProj') : `<div class="stage-add">+ <span onclick="startNewProj()">${t('newProj')}</span></div>`) +
      (doneP.length? `<h2 class="section">${t('completed')}</h2>`+doneP.map(projCard).join('') : '') +
      `<div class="w-note" style="margin-top:10px">${t('projNote')}</div>`;
    return;
  }
  const p=projects.find(x=>x.id===curProj);
  if(!p){ curProj=null; renderProjects(); return; }
  const st=projStats(p), left=st.all-st.done;
  el.innerHTML = `<button class="back" onclick="resetPEdits();curProj=null;renderProjects()">‹ ${t('projects')}</button>
    <div class="proj-card" style="cursor:default">` +
      (projRenameMode ? inlineRow('confirmProjRename','deleteProject')
        : `<div class="p-head"><div class="p-name" onclick="startProjRename()" style="cursor:pointer"><span class="pi">${ICS.folder}</span>${p.name}</div>
           <div class="p-pct">${left? t('leftN',{n:left}) : t('doneAll')}</div></div>`) +
      `<div class="p-next">${t('nextStep')}: ${nextStep(p)}</div>
    </div>` +
    p.stages.map((s,si)=>{
      const st2=s.items.reduce((a,i)=>{const c=countItem(i); a.all+=c.all; a.done+=c.done; return a;},{all:0,done:0});
      const head=(stageEdit===si)
        ? `<div style="padding:10px 14px">${inlineRow('confirmStageRename','deleteStage')}</div>`
        : `<div class="stage-head" onclick="projects.find(x=>x.id===${p.id}).stages[${si}].open^=1;renderProjects()">
            <div class="s-name" onclick="event.stopPropagation();startStageRename(${si})">${s.name}</div>
            <div class="s-cnt">${st2.done}/${st2.all} ▾</div></div>`;
      return `<div class="stage ${s.open?'open':''}">`+head+`<div class="stage-body">` +
        s.items.map((i,ii)=>itemHTML(p.id,si,i,String(ii),0)).join('') +
        (isEditing(p.id,si,'') ? addRowHTML() : `<div class="stage-add" onclick="startAdd(${p.id},${si},'')">+ ${t('taskToStage')}</div>`) +
        `</div></div>`;
    }).join('') +
    (newStageMode ? inlineRow('confirmNewStage') : `<div class="stage-add" onclick="startNewStage()">+ ${t('newStage')}</div>`);
}
function itemHTML(pid,si,i,path,level){
  const m=[];
  if(i.date) m.push(`<span>${mi('cal')}${i.date===iso(today)? DL().todayCap : fmt(fromISO(i.date))}</span>`);
  if(i.time) m.push(`<span>${mi('clock')}${i.time}</span>`);
  if(i.remind) m.push(`<span class="bell-m">${mi('bell')}</span>`);
  if(i.note) m.push(`<span>${mi('doc')}</span>`);
  let h=`<div class="sub-t ${i.done?'done':''}" style="margin-left:${level*24}px">
    <div class="chk" onclick="tgItem(${pid},${si},'${path}')">${i.done?ICS.ok:''}</div>
    <span class="st-t" onclick="openEditProj(${pid},${si},'${path}')" style="cursor:pointer">${i.t}` +
    (m.length?`<div class="t-meta" style="font-size:11px;margin-top:2px">${m.join(' ')}</div>`:'') +
    `</span>
    <button class="add-sub" onclick="startAdd(${pid},${si},'${path}')">${ICS.plus}</button></div>`;
  if(isEditing(pid,si,path)) h+=`<div style="margin-left:${(level+1)*24}px">${addRowHTML()}</div>`;
  (i.subs||[]).forEach((x,xi)=>{ h+=itemHTML(pid,si,x,path+'.'+xi,level+1); });
  return h;
}
function isEditing(pid,si,path){ return editTarget && editTarget.pid===pid && editTarget.si===si && editTarget.path===path; }
function addRowHTML(){
  return `<div class="sub-add-row">
    <input id="new-sub-input" placeholder="${t('whatToDo')}" onkeydown="if(event.key==='Enter')confirmAdd();if(event.key==='Escape')cancelAdd()">
    <button onclick="confirmAdd()">${ICS.ok}</button><button class="cancel" onclick="cancelAdd()">${ICS.cross}</button></div>`;
}
function startAdd(pid,si,path){
  resetPEdits(); editTarget={pid,si,path};
  projects.find(x=>x.id===pid).stages[si].open=1;
  renderProjects();
  setTimeout(()=>{ const el=document.getElementById('new-sub-input'); if(el) el.focus(); },60);
}
function confirmAdd(){
  const el=document.getElementById('new-sub-input');
  const text=el?el.value.trim():'';
  if(!text){ cancelAdd(); return; }
  const {pid,si,path}=editTarget;
  const stage=projects.find(x=>x.id===pid).stages[si];
  if(path===''){ stage.items.push({t:text, done:false}); }
  else{ const it=getItem(stage,path); it.subs=it.subs||[]; it.subs.push({t:text, done:false}); it.done=false; }
  editTarget=null;
  renderProjects(); saveState();
  toast(t('added'));
}
function cancelAdd(){ editTarget=null; renderProjects(); }
function tgItem(pid,si,path){
  const it=getItem(projects.find(x=>x.id===pid).stages[si],path);
  it.done=!it.done;
  rerenderAll(); saveState();
}
function moveProjTask(pid,si,path,off){
  getItem(projects.find(x=>x.id===pid).stages[si],path).date=iso(d(off));
  rerenderAll(); saveState();
  toast(t('movedTo',{d:(off===0?DL().todayCap:DL().tomorrowCap.toLowerCase())}));
}
function delProjItem(pid,si,path){
  const stage=projects.find(x=>x.id===pid).stages[si];
  const idx=path.split('.').map(Number);
  if(idx.length===1) stage.items.splice(idx[0],1);
  else{ const parent=getItem(stage, idx.slice(0,-1).join('.')); parent.subs.splice(idx[idx.length-1],1); }
  rerenderAll(); saveState();
}
function toggleProjDone(pid){
  const p=projects.find(x=>x.id===pid);
  p.done=!p.done;
  rerenderAll(); saveState();
  toast(p.done? t('projCompleted') : t('projBack'));
}
function deleteProjById(pid){
  const p=projects.find(x=>x.id===pid); if(!p) return;
  askConfirm(t('confirmProj',{p:p.name}), ()=>{
    projects=projects.filter(x=>x.id!==pid);
    resetPEdits(); rerenderAll(); saveState();
    toast(t('projDeleted'));
  });
}
function startListRename(pid){ resetPEdits(); projListEdit=pid; renderProjects(); focusRen(projects.find(x=>x.id===pid).name); }
function confirmListRename(){
  const el=document.getElementById('ren-input'); const text=el?el.value.trim():'';
  if(text) projects.find(x=>x.id===projListEdit).name=text;
  cancelPEdits(); saveState();
}
function deleteProjFromRename(){ deleteProjById(projListEdit); }
function startNewProj(){ resetPEdits(); newProjMode=true; renderProjects(); focusRen(''); }
function confirmNewProj(){
  const el=document.getElementById('ren-input'); const text=el?el.value.trim():'';
  if(text){
    const id=Math.max(0,...projects.map(x=>x.id))+1;
    projects.push({id, name:text, stages:[{name:lang()==='en'?'Stage 1':'Этап 1', open:1, items:[]}]});
    toast(t('projCreated',{p:text}));
  }
  cancelPEdits(); saveState();
}
function startProjRename(){ resetPEdits(); projRenameMode=true; renderProjects(); focusRen(projects.find(x=>x.id===curProj).name); }
function confirmProjRename(){
  const el=document.getElementById('ren-input'); const text=el?el.value.trim():'';
  if(text) projects.find(x=>x.id===curProj).name=text;
  cancelPEdits(); saveState();
}
function deleteProject(){
  const p=projects.find(x=>x.id===curProj); if(!p) return;
  askConfirm(t('confirmProj',{p:p.name}), ()=>{
    projects=projects.filter(x=>x.id!==p.id);
    curProj=null; resetPEdits(); rerenderAll(); saveState();
    toast(t('projDeleted'));

function buildChips(){
  // лента дат: сегодня, завтра, дальше 60 дней — прокручивается как в «Записано»
  const dc=document.getElementById('date-chips');
  let h = sheetMode==='editProj' ? `<div class="chip" data-d="">${t('noDate')}</div>` : '';
  h+=`<div class="chip" data-d="${iso(today)}">${DL().todayChip}</div><div class="chip" data-d="${iso(d(1))}">${DL().tomorrowCap}</div>`;
  const near=[iso(today), iso(d(1))];
  for(let i=2;i<=60;i++){
    const dt=d(i); near.push(iso(dt));
    h+=`<div class="chip" data-d="${iso(dt)}"><small>${DL().DW[dt.getDay()]}</small>${dt.getDate()}.${String(dt.getMonth()+1).padStart(2,'0')}</div>`;
  }
  if(selDate && !near.includes(selDate)) h+=`<div class="chip" data-d="${selDate}">${fmt(fromISO(selDate))}</div>`;
  h+=`<div class="chip" data-d="pick">${mi('cal')}</div>`;
  dc.innerHTML=h;
  dc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.d==='pick'){ toggleAddCal(); return; }
    selDate=c.dataset.d; markChips();
  });
  // лента времени: каждые полчаса + свой (слайдер)
  const tc=document.getElementById('time-chips');
  let th=`<div class="chip" data-t="">${t('noTime')}</div>`;
  for(let m=7*60; m<=22*60+30; m+=30){
    const v=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    th+=`<div class="chip" data-t="${v}">${v}</div>`;
  }
  th+=`<div class="chip" data-t="custom" id="t-custom">${mi('clock')}</div>`;
  tc.innerHTML=th;
  tc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.t==='custom'){
      const box=document.getElementById('time-slider-box');
      const show=box.style.display==='none'||!box.style.display;
      if(show){
        const sl=document.getElementById('time-slider');
        const [hh,mm]=(selTime||'12:00').split(':').map(Number);
        sl.value=Math.round((hh*60+mm)/10);
        sliderTime(sl.value);
      }
      box.style.display=show?'block':'none';
      return;
    }
    selTime=c.dataset.t; selRemind=!!selTime; markChips();
  });
  // когда напомнить
  const rc=document.getElementById('rem-chips');
  rc.innerHTML=`<div class="chip" data-r="start">${t('atStart')}</div>`+
    [5,10,15,30].map(n=>`<div class="chip" data-r="${n}">${t('minBefore',{n})}</div>`).join('');
  rc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.r==='start'){ selRemStart=!selRemStart; }
    else{
      const v=+c.dataset.r;
      selRemBefore=selRemBefore.includes(v)? selRemBefore.filter(x=>x!==v) : [...selRemBefore,v].sort((a,b)=>a-b);
    }
    markChips();
  });
  // повтор
  const pc2=document.getElementById('rep-chips');
  pc2.innerHTML=[['','repNo'],['d','repD'],['w','repW'],['m','repM'],['q','repQ'],['y','repY']]
    .map(([v,k])=>`<div class="chip" data-rep="${v}">${t(k)}</div>`).join('');
  pc2.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ selRepeat=c.dataset.rep; markChips(); });
  // куда
  const pc=document.getElementById('proj-chips');
  pc.innerHTML=`<div class="chip" data-p="0">${t('justList')}</div>`+
    projects.filter(p=>!p.done).map(p=>`<div class="chip" data-p="${p.id}">${p.name}</div>`).join('');
  pc.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ selProj=+c.dataset.p; markChips(); });
  markChips();
}
function markChips(){
  document.querySelectorAll('#date-chips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.d===selDate));
  const presets=[...document.querySelectorAll('#time-chips .chip')].map(c=>c.dataset.t);
  document.querySelectorAll('#time-chips .chip').forEach(c=>{
    if(c.dataset.t==='custom'){
      const isCustom=!!selTime && !presets.includes(selTime);
      c.classList.toggle('sel', isCustom);
      c.innerHTML=isCustom? selTime : mi('clock');
    } else c.classList.toggle('sel', c.dataset.t===selTime);
  });
  document.querySelectorAll('#proj-chips .chip').forEach(c=>c.classList.toggle('sel', +c.dataset.p===selProj));
  document.getElementById('remind-tg').classList.toggle('on', selRemind);
  document.getElementById('smart-remind').style.display=selRemind?'block':'none';
  document.querySelectorAll('#rem-chips .chip').forEach(c=>{
    if(c.dataset.r==='start') c.classList.toggle('sel', selRemStart);
    else c.classList.toggle('sel', selRemBefore.includes(+c.dataset.r));
  });
  document.getElementById('persist-tg').classList.toggle('on', selRemPersist);
  document.querySelectorAll('#rep-chips .chip').forEach(c=>c.classList.toggle('sel', c.dataset.rep===selRepeat));
}

// разбор естественного языка: русский + английский
const DAYS_FULL={'понедельник':1,'вторник':2,'среда':3,'среду':3,'четверг':4,'пятница':5,'пятницу':5,'суббота':6,'субботу':6,'воскресенье':0,'воскресение':0,
  'monday':1,'tuesday':2,'wednesday':3,'thursday':4,'friday':5,'saturday':6,'sunday':0};
function parseNL(){
  const v=document.getElementById('q-input').value.toLowerCase();
  let found=[];
  if(/послезавтра|day after tomorrow/.test(v)){ selDate=iso(d(2)); found.push(lang()==='en'?'day after tomorrow':'послезавтра'); }
  else if(/завтра|tomorrow/.test(v)){ selDate=iso(d(1)); found.push(lang()==='en'?'tomorrow':'завтра'); }
  else if(/сегодня|today/.test(v)){ selDate=iso(today); found.push(DL().todayCap); }
  for(const w in DAYS_FULL){
    if(v.includes(w)){
      let off=(DAYS_FULL[w]-today.getDay()+7)%7; if(off===0) off=7;
      selDate=iso(d(off)); found.push(w.slice(0,3));
    }
  }
  let m=v.match(/(?:в|at)\s?(\d{1,2})[:.](\d{2})/) || v.match(/(?:в|at)\s?(\d{1,2})\s?(?:час|pm|am|o'clock)?(?![\d.])/);
  if(m && +m[1]<24){
    let hh=+m[1];
    if(/pm/.test(v) && hh<12) hh+=12;
    selTime=String(hh).padStart(2,'0')+':'+(m[2]||'00'); selRemind=true;
    found.push(selTime);
  }
  markChips();
  document.getElementById('parsed').textContent=found.length? t('understood')+found.join(', ') : '';
}
function cleanTitle(v){
  return v.replace(/послезавтра|завтра|сегодня|day after tomorrow|tomorrow|today/gi,'')
    .replace(new RegExp('(?:в|at)\\s?('+Object.keys(DAYS_FULL).join('|')+')','gi'),'')
    .replace(new RegExp('('+Object.keys(DAYS_FULL).join('|')+')','gi'),'')
    .replace(/(?:в|at)\s?\d{1,2}[:.]\d{2}/gi,'').replace(/(?:в|at)\s?\d{1,2}\s?(час(а|ов)?|pm|am)?(?![\d.])/gi,'')
    .replace(/\s+/g,' ').trim();
}

  showSheet();
}
function closeSheet(){
  document.getElementById('sheet-bg').style.display='none';
  document.getElementById('sheet').classList.remove('up');
}
function noteVal(){ return document.getElementById('note-input').value.trim()||undefined; }
function addTask(){
  const raw=document.getElementById('q-input').value.trim();
  if(!raw){ toast(t('writeTask')); return; }
  const title0=cleanTitle(raw)||raw;
  const title=title0.charAt(0).toUpperCase()+title0.slice(1);
  if(sheetMode==='editProj'){
    const {pid,si,path}=editProjRef;
    const it=getItem(projects.find(x=>x.id===pid).stages[si],path);
    it.t=title; it.date=selDate||undefined; it.time=selTime||undefined;
    it.remind=selRemind&&!!selDate;
    it.remStart=selRemStart; it.remBefore=[...selRemBefore]; it.remPersist=selRemPersist;
    it.note=noteVal();
    editProjRef=null; closeSheet(); rerenderAll(); saveState(); toast(t('saved'));
    return;
  }
  if(editTaskId){
    const x=tasks.find(v=>v.id===editTaskId);
    if(x){ x.title=title; x.date=selDate; x.time=selTime; x.remind=selRemind;
      x.remStart=selRemStart; x.remBefore=[...selRemBefore]; x.remPersist=selRemPersist;
      x.repeat=selRepeat||undefined; x.note=noteVal(); }
    editTaskId=null; closeSheet(); rerenderAll(); saveState(); toast(t('saved'));
    return;
  }
  const pname=selProj? (projects.find(p=>p.id===selProj)||{}).name : null;
  if(pname){
    const p=projects.find(x=>x.id===selProj);
    p.stages[0].items.push({t:title, done:false, date:selDate||undefined, time:selTime||undefined,
      remind:selRemind&&!!selDate, remStart:selRemStart, remBefore:[...selRemBefore], remPersist:selRemPersist, note:noteVal()});
  } else {
    tasks.push({id:++taskId, title, date:selDate, time:selTime, done:false, remind:selRemind,
      remStart:selRemStart, remBefore:[...selRemBefore], remPersist:selRemPersist,
      repeat:selRepeat||undefined, note:noteVal(), proj:pname});
  }
  closeSheet();
  toast(pname? t('addedToProj',{p:pname}) : t('taskOn',{d:(selDate===iso(today)? DL().todayCap : fmt(fromISO(selDate)))}));
  rerenderAll(); saveState();
}
function deleteTask(){
  if(sheetMode==='editProj'){
    const {pid,si,path}=editProjRef;
    delProjItem(pid,si,path);
  } else {
    tasks=tasks.filter(x=>x.id!==editTaskId);
  }
  editTaskId=null; editProjRef=null; closeSheet();
  rerenderAll(); saveState();
  toast(t('taskDeleted'));
}

// ===================== подтверждение / тост =====================
function askConfirm(text, fn){
  document.getElementById('confirm-text').textContent=text;
  document.getElementById('confirm-no').textContent=t('cancel');
  document.getElementById('confirm-yes').textContent=t('del');
  document.getElementById('confirm-yes').onclick=()=>{ hideConfirm(); fn(); };
  document.getElementById('confirm-bg').style.display='flex';
}
function hideConfirm(){ document.getElementById('confirm-bg').style.display='none'; }
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._h); el._h=setTimeout(()=>el.classList.remove('show'),2200);
}

// ===================== свайпы по задачам =====================
let swEl=null, swX=0, swY=0, swDx=0, swLock=null, swSuppress=false;
const mainEl=document.querySelector('main');
mainEl.addEventListener('pointerdown', e=>{
  const x=e.target.closest('.task');
  if(!x || e.target.closest('button') || e.target.closest('.chk')) return;
  swEl=x; swX=e.clientX; swY=e.clientY; swDx=0; swLock=null;
});
mainEl.addEventListener('pointermove', e=>{
  if(!swEl) return;
  const dx=e.clientX-swX, dy=e.clientY-swY;
  if(!swLock && (Math.abs(dx)>9||Math.abs(dy)>9)) swLock=Math.abs(dx)>Math.abs(dy)*1.3?'x':'y';
  if(swLock!=='x') return;
  swDx=dx;
  swEl.style.transform='translateX('+Math.max(-110,Math.min(110,swDx))+'px)';
});
function swEnd(){
  if(!swEl) return;
  const el=swEl, dx=swLock==='x'?swDx:0;
  swEl=null; swLock=null;
  el.style.transform='';
  if(Math.abs(dx)>12) swSuppress=true;
  document.querySelectorAll('.task.swiped').forEach(x=>{ if(x!==el) x.classList.remove('swiped'); });
  if(dx>70){
    if(el.dataset.tid) toggle(+el.dataset.tid);
    else if(el.dataset.ref){ const [pid,si,path]=el.dataset.ref.split('|'); tgItem(+pid,+si,path); }
  } else if(dx<-70){ el.classList.add('swiped'); }
  else if(dx<-12){ el.classList.remove('swiped'); }
  swDx=0;
}
mainEl.addEventListener('pointerup', swEnd);
mainEl.addEventListener('pointercancel', ()=>{ if(swEl){ swEl.style.transform=''; swEl=null; swLock=null; } });
document.addEventListener('click', e=>{
  if(swSuppress){ e.stopPropagation(); e.preventDefault(); swSuppress=false; }
}, true);

// ===================== голосовой ввод =====================
let rec=null;
function voiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast(t('voiceNo')); return; }
  if(rec){ rec.stop(); return; }
  const btn=document.getElementById('mic-btn');
  rec=new SR();
  rec.lang=lang()==='en'?'en-US':'ru-RU'; rec.interimResults=true; rec.continuous=false;
  rec.onresult=e=>{
    const text=[...e.results].map(r=>r[0].transcript).join('').trim();
    document.getElementById('q-input').value=text;
    parseNL();
  };
  rec.onend=()=>{ btn.classList.remove('rec'); rec=null; };
  rec.onerror=ev=>{ if(ev.error!=='aborted') toast(t('voiceErr')); };
  btn.classList.add('rec');
  try{ rec.start(); toast(t('voiceGo')); }
  catch(e){ btn.classList.remove('rec'); rec=null; }
}

// ===================== сохранение =====================
function saveState(){
  try{ localStorage.setItem('poryadok-v3', JSON.stringify({tasks, projects, taskId, SET})); }catch(e){}
}
function loadState(){
  try{
    let s=JSON.parse(localStorage.getItem('poryadok-v3'));
    if(!s){ // миграция со старой тест-версии
      const old=JSON.parse(localStorage.getItem('poryadok-v2'));
      if(old && old.tasks){ s={tasks:old.tasks, projects:old.projects, taskId:old.taskId, SET:{...SET, theme:old.themeMode||'dark'}}; }
    }
    if(s && s.tasks && s.projects){
      tasks=s.tasks; projects=s.projects; taskId=s.taskId||100;
      if(s.SET) SET={...SET, ...s.SET, notif:{...SET.notif, ...(s.SET.notif||{})}};
    }
  }catch(e){}
}

// ===================== старт =====================
loadState();
applyTheme();
buildSheetLabels();
renderNav();
go('today');
setInterval(saveState, 3000);
window.addEventListener('pagehide', saveState);
</script>
